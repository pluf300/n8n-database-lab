<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>n8n Database Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Plain course-handout look: white page, black text, one typeface, thin rules between steps. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface2:#f1f1f1; --ink:#000000; --muted:#000000; --line:#000000; --soft:#c9c9c9;
  --logic:#0b3fa8; --data:#0a6b2d; --sec:#9c1c1c; --notebg:#fff6cc; --okbg:#e9f6ec; --teachbg:#e8eefc;
  --code-bg:#f1f1f1; --code-ink:#000000; --code-dim:#000000; --btn:#000000; --btn-ink:#ffffff;
  --sans:'Libre Franklin',Helvetica,Arial,sans-serif; --mono:'IBM Plex Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121212; --surface:#121212; --surface2:#242424; --ink:#ffffff; --muted:#ffffff; --line:#ffffff; --soft:#5a5a5a;
  --logic:#9dbcff; --data:#7fd99a; --sec:#ff9d9d; --notebg:#3b3300; --okbg:#12301b; --teachbg:#1a2647;
  --code-bg:#242424; --code-ink:#ffffff; --code-dim:#ffffff; --btn:#ffffff; --btn-ink:#000000; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121212; --surface:#121212; --surface2:#242424; --ink:#ffffff; --muted:#ffffff; --line:#ffffff; --soft:#5a5a5a;
  --logic:#9dbcff; --data:#7fd99a; --sec:#ff9d9d; --notebg:#3b3300; --okbg:#12301b; --teachbg:#1a2647;
  --code-bg:#242424; --code-ink:#ffffff; --code-dim:#ffffff; --btn:#ffffff; --btn-ink:#000000; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,h4,p,ul,ol{margin:0} ul,ol{padding-left:24px}
a{color:var(--logic)} code,kbd,pre{font-family:var(--mono)}
code{background:var(--surface2);padding:1px 5px;font-size:.88em;overflow-wrap:anywhere}
kbd{border:1px solid var(--ink);border-radius:3px;padding:0 5px;font-size:.82em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--logic);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:2px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
.brand{flex:1 1 300px;min-width:0}
.brand b{display:block;font-size:18px;font-weight:700}
.brand span{font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{background:var(--bg);border:0;padding:5px 14px;font-size:15px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);font-weight:600}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:15px}
.prog{flex:1 1 100%;display:flex;align-items:center;gap:12px;font-size:14px;font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ink);width:0}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;max-width:1240px;margin:0 auto;padding-block:24px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);align-self:start;max-height:calc(100vh - 120px);overflow:auto}
nav.side .grp{font-weight:700;font-size:15px;padding:14px 0 4px;border-bottom:1px solid var(--line);margin-bottom:4px}
nav.side button{display:flex;width:100%;gap:8px;align-items:baseline;text-align:left;background:none;border:0;padding:4px 0;font-size:15px}
nav.side button:hover .lbl{text-decoration:underline}
nav.side button[aria-current="true"]{font-weight:700}
nav.side button[aria-current="true"] .lbl{text-decoration:underline}
nav.side .dot{flex:none;width:16px;font-size:14px;color:var(--data);font-weight:700}
nav.side .lbl{flex:1;min-width:0}
nav.side .ct{font-size:13px;font-variant-numeric:tabular-nums}
nav.side .locked .lbl{text-decoration:line-through}
main{min-width:0;display:flex;flex-direction:column;gap:22px;max-width:860px}
.env{border:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.env-h{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.env-h span{font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:4px 22px}
.chip em{font-style:normal;font-weight:600}
.chip.on{color:var(--data);font-weight:600}
.sec-h{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:15px}
.sec-h h1{font-size:34px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.sec-h p{max-width:70ch}
.card{display:flex;flex-direction:column;gap:12px;min-width:0;border:1px solid var(--soft);padding:16px 18px}
.card.step{border:0;border-top:2px solid var(--line);padding:18px 0 4px}
.step-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.num{font-size:22px;font-weight:700}
.num::after{content:"."}
.step.ok .num::before{content:"✓ ";color:var(--data)}
.step-h h3{font-size:22px;font-weight:700;line-height:1.3;flex:1;min-width:0}
.blk{display:flex;flex-direction:column;gap:5px;min-width:0}
.blk>label,.lab{font-weight:700;font-size:16px}
.blk p,.blk li{max-width:72ch}
.blk ol,.blk ul{display:flex;flex-direction:column;gap:4px}
.nodechip{display:inline-block;border:1px solid var(--line);padding:4px 10px;font-weight:600;width:fit-content;max-width:100%}
.cfg{width:100%;border-collapse:collapse;font-size:15px}
.cfg td{border:1px solid var(--soft);padding:5px 9px;vertical-align:top}
.cfg td:first-child{width:36%;font-weight:600}
.cfg .v{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.cfg .v span{font-family:var(--mono);font-size:14px;overflow-wrap:anywhere;min-width:0}
.tag{font-style:italic;font-family:var(--sans);font-size:13px;margin-right:6px;white-space:nowrap}
.tag::before{content:"("}.tag::after{content:")"}
.scroll{overflow-x:auto}
.copy{background:var(--code-bg);color:var(--code-ink);border:1px solid var(--soft)}
.copy-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 8px 0 12px;font-size:13px;font-weight:600}
.copy pre{margin:0;padding:4px 12px 10px;font-size:14px;line-height:1.5;overflow-x:auto;white-space:pre}
.copy.wrapit pre{white-space:pre-wrap;overflow-wrap:anywhere}
.cbtn{flex:none;border:1px solid var(--line);background:var(--bg);font-size:13px;padding:1px 9px}
.cbtn:hover{background:var(--btn);color:var(--btn-ink)}
.cbtn.ok{background:var(--data);border-color:var(--data);color:var(--bg)}
.expect{background:var(--okbg);padding:10px 14px}
.warn{background:var(--notebg);padding:10px 14px;display:flex;flex-direction:column;gap:3px;border:1px solid var(--soft)}
.note{background:var(--surface2);padding:10px 14px}
.shot{border:1px dashed var(--line);padding:14px;display:flex;gap:12px;align-items:center;font-size:15px}
.shot svg{flex:none} .shot b{display:block}
.ck{display:flex;flex-wrap:wrap;gap:8px 22px;padding-top:4px}
.ck label{display:flex;gap:9px;align-items:center;font-weight:600}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--data)}
details{border:1px solid var(--soft)}
details summary{cursor:pointer;padding:7px 12px;font-weight:600}
details .d-in{padding:0 12px 10px;display:flex;flex-direction:column;gap:6px}
.teach{background:var(--teachbg);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.btn{display:inline-block;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);padding:8px 16px;font-weight:600;font-size:16px;text-decoration:none}
.btn.ghost{background:var(--bg);color:var(--ink)}
.pn{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:2px solid var(--line);padding-top:18px}
.flow{display:flex;flex-direction:column;gap:6px;font-size:15px}
.flow .row{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.flow .rl{font-weight:700;min-width:84px}
.flow .n{border:1px solid var(--line);padding:1px 8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mini{border:1px solid var(--soft);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini span{font-size:15px}
table.data{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.data th,table.data td{border:1px solid var(--soft);padding:3px 9px;text-align:left;white-space:nowrap}
table.data th{background:var(--surface2);font-weight:700}
.oscards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.oscards button{border:1px solid var(--line);background:var(--bg);padding:16px;text-align:left;display:flex;flex-direction:column;gap:2px}
.oscards button b{font-size:21px}.oscards button span{font-size:15px}
.oscards button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.arch{display:flex;flex-direction:column;align-items:center;gap:4px}
.arch .rowx{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:100%}
.arch .box{border:1px solid var(--line);padding:8px 12px;text-align:center;min-width:170px;flex:0 1 240px}
.arch .box b{display:block}.arch .box span{font-size:14px}
.arch .dn{font-size:16px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.mnav{display:none}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:14px}
  nav.side{position:static;max-height:none;display:none;border:1px solid var(--line);padding:0 12px 10px}
  nav.side.open{display:block}
  .mnav{display:inline-block}
  .sec-h h1{font-size:27px}
  .cfg td:first-child{width:40%}
}
</style>
<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>AI-Powered Database Automation with n8n</b><span>Application Database Management · hands-on lab</span></div>
  <button class="btn ghost mnav" id="mnav" type="button" aria-expanded="false">Sections</button>
  <div class="seg" role="group" aria-label="Operating system">
    <button type="button" data-os="win" aria-pressed="false">Windows</button><button type="button" data-os="mac" aria-pressed="false">macOS</button>
  </div>
  <label class="tog"><input type="checkbox" id="instr"> Instructor mode</label>
  <div class="prog"><span id="ptext">0 of 0 checkpoints</span><div class="bar"><i id="pbar"></i></div><button class="cbtn" id="reset" type="button">Reset progress</button></div>
</div></header>
<div class="wrap">
  <nav class="side" id="nav" aria-label="Lab sections"></nav>
  <main id="main"></main>
</div>

var TRG = "When Executed by Another Workflow";
var T = "$('" + TRG + "').first().json";
function os(win, mac){ return {__os:1, win:win, mac:mac}; }

/* ---------- Troubleshooting library ---------- */
var TS = {
 "win-node":["win","Windows: “node is not recognized”",`<p>Causes: Node.js isn't installed, PowerShell was open during the install, or PATH hasn't refreshed.</p><ol><li>Close every PowerShell window.</li><li>Open PowerShell again and run <code>node -v</code>.</li><li>Still missing? Open <b>Settings → Apps → Installed apps</b> and look for Node.js. If it isn't listed, run the installer again and keep the default options (they add Node.js to PATH).</li></ol>`],
 "win-npm":["win","Windows: “npm is not recognized”",`<p>npm is installed together with Node.js. Close and reopen PowerShell first. If <code>node -v</code> works but <code>npm -v</code> doesn't, run the Node.js installer again and choose <b>Repair</b>.</p>`],
 "win-npx":["win","Windows: “npx is not recognized”",`<p>npx ships with npm. Run <code>npm -v</code>. If npm is missing too, fix the Node.js installation first, then reopen PowerShell.</p>`],
 "win-policy":["win","Windows: “npx.ps1 cannot be loaded because running scripts is disabled”",`<p>PowerShell is blocking the script wrapper. You don't need to change any security setting. Run the command-file version instead:</p><p><code>npx.cmd n8n</code></p><p>Don't change the machine-wide execution policy for this lab.</p>`],
 "mac-node":["mac","macOS: “command not found: node”",`<p>Causes: Node.js isn't installed, Terminal was open during the install, or PATH hasn't refreshed.</p><ol><li>Quit Terminal completely (<kbd>Command</kbd> + <kbd>Q</kbd>).</li><li>Open Terminal again and run <code>node -v</code>.</li><li>Still missing? Run the Node.js <code>.pkg</code> installer again.</li></ol>`],
 "mac-npm":["mac","macOS: “command not found: npm”",`<p>npm is installed together with Node.js. Quit and reopen Terminal. If it's still missing, reinstall a supported Node.js version from the official <code>.pkg</code> installer.</p>`],
 "mac-npx":["mac","macOS: “command not found: npx”",`<p>Run <code>npm -v</code>. If npm works, quit and reopen Terminal and try again. If npm is missing, reinstall Node.js.</p>`],
 "mac-arch":["mac","macOS: Apple silicon or Intel?",`<p>The official macOS <code>.pkg</code> installer works on both, so you normally don't need to know. If you download a different package and must choose: <b>Apple menu → About This Mac</b>. “Chip: Apple M…” means Apple silicon (ARM64). “Processor: Intel” means Intel (x64).</p>`],
 "mac-gate":["mac","macOS blocks the installer",`<p>If macOS says the installer can't be opened, go to <b>System Settings → Privacy &amp; Security</b>, find the message about the blocked installer and choose <b>Open Anyway</b>. Only do this for the file you downloaded from nodejs.org. Don't turn off any macOS security features.</p>`],
 "port":["","Port 5678 is already in use",os(`<p>Another n8n is probably still running. Look for another PowerShell window that is running n8n, click it and press <kbd>Ctrl</kbd> + <kbd>C</kbd>. Then run <code>npx n8n</code> again.</p>`,`<p>Another n8n is probably still running. Look for another Terminal window or tab that is running n8n, click it and press <kbd>Control</kbd> + <kbd>C</kbd>. Then run <code>npx n8n</code> again.</p>`)],
 "npxfail":["","npx n8n fails or seems stuck",`<ul><li>The first run downloads a large package. Several minutes with little output is normal on classroom Wi-Fi.</li><li>If npm asks “Ok to proceed?”, type <code>y</code> and press Enter.</li><li>Network errors (<code>ETIMEDOUT</code>, <code>ECONNRESET</code>): check Wi-Fi and run the command again.</li><li>Errors that mention an unsupported engine: your Node.js version is outside 20.19–24.x. Check with <code>node -v</code>.</li></ul>`],
 "nolocal":["","localhost:5678 doesn't open",`<ul><li>Wait until the terminal prints that the editor is accessible. The page won't load before that.</li><li>Use <code>http://</code>, not <code>https://</code>.</li><li>Check that the terminal running n8n is still open and hasn't printed an error.</li></ul>`],
 "stopped":["","n8n stopped working mid-lab",`<p>The terminal window running n8n was closed or the process was stopped. Open a terminal, run <code>npx n8n</code>, wait for it to start and reload <code>http://localhost:5678</code>. Saved workflows and credentials are still there.</p>`],
 "signin":["","Google sign-in window fails or closes",`<ul><li>Allow pop-ups for <code>localhost:5678</code> and try <b>Sign in with Google</b> again.</li><li>Pick the same Google account you added as a test user.</li><li>School accounts sometimes block Google Cloud. Use a personal Gmail account for the lab.</li></ul>`],
 "denied":["","Google: “Access blocked” / “access_denied”",`<p>Your OAuth app is in Testing mode and the account you chose isn't a test user. In Google Cloud go to <b>Google Auth Platform → Audience → Test users → Add users</b>, add your own address and try again.</p>`],
 "unverified":["","“Google hasn't verified this app”",`<p>This is expected for a personal test app. If you are a test user, choose <b>Continue</b> (you may need <b>Advanced</b> first). If there is no way to continue, add your account under <b>Audience → Test users</b>.</p>`],
 "redirect":["","Error 400: redirect_uri_mismatch",`<p>The redirect URI in Google Cloud doesn't exactly match the one n8n sent. Copy the <b>OAuth Redirect URL</b> from your n8n credential again and paste it under <b>Authorized redirect URIs</b> in your OAuth client. Protocol (<code>http</code>), port and path must match exactly, with no trailing space. Changes can take a few minutes to apply.</p>`],
 "client":["","“Client authentication failed” / invalid_client",`<p>Google didn't accept the Client ID and Client Secret saved in n8n. The window says <i>Error: Client authentication failed … invalid_client. Failed to connect.</i></p><ol><li>In Google Cloud open <b>Google Auth Platform → Clients</b> and click your client (<code>n8n local</code>).</li><li>Copy its <b>Client ID</b> into n8n. If you made more than one client, the ID and the secret must come from the same one.</li><li>Under <b>Client secrets</b>, make sure one is enabled. You can't view an existing secret again, so choose <b>Add secret</b> and copy the new one into n8n with the copy icon.</li><li>Save the credential, wait 2–5 minutes (new clients and secrets take a moment to work) and choose <b>Sign in with Google</b> again.</li></ol>`],
 "testuser":["","Missing test user",`<p>External apps in Testing mode only allow listed test users. Add your Google address under <b>Google Auth Platform → Audience → Test users</b>.</p>`],
 "sheetsapi":["","“Google Sheets API has not been used in project…”",`<p>The Sheets API isn't enabled in the project that owns your OAuth client. Check the project dropdown at the top of Google Cloud shows <code>n8n-class-lab</code>, then <b>APIs &amp; Services → Library → Google Sheets API → Enable</b>. Wait a minute and retry.</p>`],
 "driveapi":["","Google Drive API not enabled",`<p>The Google Sheets node uses the Drive API to list your spreadsheets. Enable it: <b>APIs &amp; Services → Library → Google Drive API → Enable</b>.</p>`],
 "notlisted":["","Spreadsheet doesn't appear in the Document list",`<ul><li>Check the Drive API is enabled.</li><li>Check you authorized the same Google account that owns <b>AI Database Lab</b>.</li><li>Workaround: set <b>Document</b> to <b>By URL</b> and paste the spreadsheet's address from your browser.</li></ul>`],
 "dlfail":["","The data file won't download or import",`<ul><li>If the button does nothing, ask your instructor for the file, or use the backup in the next step to paste the data by hand.</li><li>If Google Sheets shows an import error, try again with <b>Import location: Insert new sheet(s)</b>, then delete the empty <b>Sheet1</b>.</li><li>Make sure you imported into <b>AI Database Lab</b>, not into a new spreadsheet.</li></ul>`],
 "emptyvals":["","“At least one value has to be added under ‘Values to Send’”",`<p>The Google Sheets node ran before its columns were filled. Fill every column under <b>Values to Send</b>: drag each field from the INPUT panel onto the column with the same name, or switch the field to <b>Expression</b> and paste the value from this guide. Then choose <b>Execute step</b> again. If the INPUT panel is empty, click <b>Execute previous nodes</b> first.</p>`],
 "wrongop":["","Mapping Column Mode missing, “No columns found in Google Sheets”, or the node reads rows instead of adding one",`<ul><li>Check <b>Operation</b>. It must say <b>Append Row</b> (or <b>Update Row</b> in workflow 03). <b>Get Row(s)</b> only reads data.</li><li>Check the selector to the left of <b>Sheet</b>. It must say <b>From list</b> with a tab chosen. <b>By ID</b> with an empty ID means no sheet is chosen, so Mapping Column Mode stays hidden. Switching Sheet to Expression makes the setting appear but then shows “No columns found”. Switch back to <b>Fixed</b>, choose <b>From list</b> and pick the tab.</li><li>The column fields appear only after both <b>Document</b> and <b>Sheet</b> are chosen and <b>Mapping Column Mode</b> is set to <b>Map Each Column Manually</b>.</li><li>The sheet must have its header row in row 1, otherwise n8n has no column names to show.</li><li>If the INPUT panel says <b>Execute previous nodes</b>, click it so you can see and drag the fields.</li></ul>`],
 "a1name":["","First column is called “AI Database Lab” instead of “StudentID”",`<p>Cell <b>A1</b> of the STUDENTS tab contains the spreadsheet name. This happens when the name is typed into a cell instead of the title box at the top. Click cell A1 of STUDENTS, type <code>StudentID</code>, press Enter and run the node again. Check A1 on the other tabs too.</p>`],
 "tabname":["","Sheet tab name is wrong or missing",`<p>Tab names must be exactly <code>STUDENTS</code>, <code>COURSES</code>, <code>ENROLLMENTS</code>, <code>ASSIGNMENTS</code>, <code>AUDIT_LOG</code>. Rename the tab in Google Sheets, then reopen the node and pick the sheet again.</p>`],
 "colname":["","Wrong column name / value comes back empty",`<p>Expressions are case-sensitive: <code>$json.GPA</code> is not <code>$json.gpa</code>. Open the previous node's output and compare the exact column names. Also check row 1 of the sheet for typos or trailing spaces.</p>`],
 "norows":["","Google Sheets node returns no rows",`<ul><li>Headers must be in row 1 and data must start in row 2.</li><li>Check the node points at the right tab.</li><li>If you added a filter in the node, check the value has no extra spaces.</li></ul>`],
 "filterall":["","Filter removes every record (Kept is empty, Discarded has 6 items)",`<ul><li><b>Check the trigger first.</b> Open <b>When Executed by Another Workflow</b> and look at its output. If <code>major</code> or <code>minimumGpa</code> shows <code>null</code>, the test data isn't pinned. Set the mock data again with the JSON from Step 1, run Get Students, then run the Filter again.</li><li>Look at the small icon to the right of each condition: ⊗ means that condition fails, ✓ means it passes. That tells you which value to check.</li><li>Check the value type selector: Major must compare as <b>String</b>, GPA as <b>Number</b>.</li><li>When the router calls this workflow, check that it sends <code>major</code> and <code>minimumGpa</code>.</li><li>“Software Development” must match the sheet exactly, including capital letters.</li></ul>`],
 "textnum":["","Number is treated as text",`<p>If GPA shows in quotes (<code>"3.9"</code>) it's a string. In Google Sheets select the GPA column and choose <b>Format → Number → Automatic</b>. In the Filter or If node you can also turn on the type-conversion option (labelled <b>Convert types where required</b> or <b>Less Strict Type Validation</b>, depending on version).</p>`],
 "sublist":["","Sub-workflow doesn't appear in the list",`<ul><li>Save the sub-workflow first.</li><li>It must start with the <b>${TRG}</b> trigger.</li><li>If n8n says the workflow must be published or active, open the sub-workflow and choose <b>Publish</b> (label may vary slightly by n8n version).</li><li>Reload the browser tab of the parent workflow.</li></ul>`],
 "subinput":["","Sub-workflow inputs are missing in the Execute Sub-workflow node",`<p>Inputs only appear when the sub-workflow's trigger uses <b>Input data mode: Define using fields below</b> and the sub-workflow is saved. After adding fields, go back to the parent, reopen the node and reselect the workflow (or use the refresh option next to <b>Workflow Inputs</b>).</p>`],
 "submap":["","Sub-workflow receives empty or wrong values",`<p>Open the Execute Sub-workflow node and check each input. Values that come from earlier nodes must be in <b>Expression</b> mode (they turn into a highlighted expression). Text like <code>{{ $json.major }}</code> shown as plain text means the field is still in Fixed mode.</p>`],
 "nooutput":["","Workflow returns no output",`<p>A sub-workflow returns the output of its last node. If an earlier node outputs zero items, later nodes don't run. Open <b>Executions</b>, click the run and find the first node with no output.</p>`],
 "notactive":["","“Workflow is not active and cannot be executed”",`<p>The workflow being called has not been published. A parent workflow always runs the <b>published</b> version of a sub-workflow; saving alone is not enough.</p><ol><li>Open the sub-workflow named in the node (02, 03, 04 or 05).</li><li>Make sure its trigger has no pinned data.</li><li>Click <b>Publish</b> at the top right.</li><li>Go back to the parent and run the step again.</li></ol><p>Check all four: 02, 03 and 05 also call 04, so the Audit Logger must be published too. After you change a sub-workflow, publish it again, or callers keep running the old version.</p>`],
 "sortfield":["","“Couldn't find the field 'average_GPA' in the input data”",`<p>The Sort node is connected to the wrong node. <code>average_GPA</code> only exists in the output of <b>Stats by Major</b>. If the INPUT panel shows <b>Get Students</b> with 6 items at the top, Sort is attached to Get Students. On the canvas, delete the line from Get Students to Sort by Average (hover over it and click the trash icon), then drag a new line from <b>Stats by Major</b> to <b>Sort by Average</b> and run the step again.</p>`],
 "efname":["","“[object Object]… expects a array but we got ''” or a similar type error in Edit Fields",`<p>The expression was pasted into the field's <b>Name</b> box instead of its <b>Value</b> box. In each field, the top-left box is the name (type a plain name such as <code>count</code>, in Fixed mode), the dropdown is the type, and the box underneath that says <i>value</i> is where the expression goes. Move each expression into the Value box, type the plain name in the Name box and run the step again.</p>`],
 "nulls":["","Every field shows null after unpinning",`<p>That is expected. A sub-workflow gets its inputs from the workflow that calls it. Run on its own without pinned data, every input is <code>null</code>. If this happened in the Audit Logger, it also appended a row with only a timestamp to AUDIT_LOG: delete that row in Google Sheets. To test a sub-workflow on its own, pin test data again, run it, then unpin.</p>`],
 "pinned":["","Audit log keeps showing my test values",`<p>The trigger still has pinned test data. Open the sub-workflow, open the trigger node and unpin the data, then save.</p>`],
 "nodename":["","“Referenced node doesn't exist”",`<p>An expression mentions a node by name and the name doesn't match. Node names are exact. Rename your node to the name shown in this guide (select the node and press <kbd>F2</kbd>, or double-click its name).</p>`],
 "expired":["","Google credential stopped working after about a week",`<p>Tokens for External apps in Testing mode expire after seven days. Open the credential in n8n and choose <b>Sign in with Google</b> again.</p>`],
 "aikey":["","AI credential error (401 / invalid API key)",`<p>The key was pasted incorrectly, was revoked or belongs to a project without API access. Create a new key in your OpenAI account, paste it into the n8n credential and save. Never paste the key into a node field or a prompt.</p>`],
 "aiquota":["","AI quota or rate limit (429)",`<p>The account has no credit or is sending too many requests. Wait and retry, or skip the AI step. The rest of the lab doesn't depend on it.</p>`]
};

var CODE = "// Build one report object from the student rows and the per-major summary\nconst students = $('Get Students').all().map(i => i.json);\nconst round2 = n => Math.round(Number(n) * 100) / 100;\nconst ranked = [...students].sort((a, b) => Number(b.GPA) - Number(a.GPA));\nconst top = ranked[0];\nconst bottom = ranked[ranked.length - 1];\n\nconst byMajor = {};\nfor (const item of $input.all()) {\n  const row = item.json;\n  const countKey = Object.keys(row).find(k => k.startsWith('count'));\n  const avgKey = Object.keys(row).find(k => k.startsWith('average'));\n  byMajor[row.Major] = {\n    students: row[countKey],\n    averageGPA: round2(row[avgKey]),\n  };\n}\n\nreturn [{\n  json: {\n    totalStudents: students.length,\n    activeStudents: students.filter(s => s.Status === 'Active').length,\n    inactiveStudents: students.filter(s => s.Status !== 'Active').length,\n    highestGPA: { name: top.Name, gpa: Number(top.GPA) },\n    lowestGPA: { name: bottom.Name, gpa: Number(bottom.GPA) },\n    byMajor,\n  },\n}];";
