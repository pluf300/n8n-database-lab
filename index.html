 {id:"g1", title:"Open Google Cloud Console and create a project", why:"The project is the container for your APIs and your OAuth client.",
  do:["Open Google Cloud Console (button below) and sign in. Accept the terms if asked.","Open the project dropdown at the top and choose <b>New project</b>.","Name it <code>n8n-class-lab</code> and choose <b>Create</b>.","Make sure the dropdown at the top now shows <b>n8n-class-lab</b>."],
  link:{href:"https://console.cloud.google.com/", label:"Open Google Cloud Console"}, copy:[{t:"Project name",v:"n8n-class-lab"}],
  expect:"The top bar shows n8n-class-lab as the selected project.", check:"Project created and selected.", pf:"proj"},
 {id:"g2", title:"Enable two APIs", why:"The Google Sheets node uses the Sheets API to read and write cells and the Drive API to find your spreadsheet. It needs both.",
  do:["Open <b>APIs &amp; Services → Library</b>.","Search <code>Google Sheets API</code>, open it and choose <b>Enable</b>.","Go back to the Library. Search <code>Google Drive API</code>, open it and choose <b>Enable</b>."],
  copy:[{t:"Search 1",v:"Google Sheets API"},{t:"Search 2",v:"Google Drive API"}],
  expect:"Both API pages show <b>Status: Enabled</b> (some pages show a <b>Manage</b> button instead of Enable).", img:{src:IMG_G2, alt:"Google Cloud page for the Google Drive API showing Service name drive.googleapis.com, Type Public API and Status Enabled, with a Create credentials banner at the top.", cap:"An enabled API: <b>Status</b> says <b>Enabled</b>. Check this for both the Google Sheets API and the Google Drive API. Ignore the <b>Create credentials</b> banner for now; you create the credentials in Step 6."},
  checks:[{id:"g2a",label:"Google Sheets API enabled"},{id:"g2b",label:"Google Drive API enabled"}], trouble:["sheetsapi","driveapi"]},
 {id:"g3", title:"Configure the OAuth consent screen", why:"Google shows this screen when an app asks for access to your data. It must exist before you can create a client.",
  do:["Open <b>APIs &amp; Services → OAuth consent screen</b>. This opens <b>Google Auth Platform</b>.","Choose <b>Get started</b>.","App name: <code>n8n class lab</code>. User support email: your address.","Audience: <b>External</b>.","Contact information: your address. Agree to the policy and choose <b>Create</b>."],
  copy:[{t:"App name",v:"n8n class lab"}], expect:"Google Auth Platform shows your app with the publishing status <b>Testing</b>.", check:"Consent screen configured as External."},
 {id:"g4", title:"Add yourself as a test user", why:"An External app in Testing mode only lets listed test users sign in.",
  do:["In Google Auth Platform open <b>Audience</b>.","Under <b>Test users</b> choose <b>Add users</b>.","Enter the same Google address that owns the AI Database Lab spreadsheet and save."],
  expect:"Your address is listed under Test users.", check:"My Google account is a test user.", pf:"test", trouble:["testuser","denied"]},
 {id:"g5", title:"Start the credential in n8n and copy the redirect URL", why:"Google will only send the sign-in result to the exact address n8n gives you.",
  do:["In n8n, go to the overview page and open the <b>Credentials</b> tab.","Choose <b>Create credential</b>, search <code>Google Sheets OAuth2 API</code> and continue.","Find <b>OAuth Redirect URL</b> and copy it with the copy icon. It looks similar to <code>http://localhost:5678/rest/oauth2-credential/callback</code>.","Leave this n8n tab open."],
  html:`<div class="warn"><b>Don't type or guess this URL</b><span>Copy the exact value from your own n8n credential screen. One different character causes <code>redirect_uri_mismatch</code>.</span></div>`,
  expect:"The redirect URL is on your clipboard and the credential window is still open.", img:{src:IMG_G5, alt:"n8n Google Sheets credential showing the OAuth Redirect URL field with the value http://localhost:5678/rest/oauth2-credential/callback, below a green Account connected bar.", cap:"The <b>OAuth Redirect URL</b> field in the n8n credential. Copy this value. On a standard local install it is <code>http://localhost:5678/rest/oauth2-credential/callback</code>, but always copy it from your own screen. The green <b>Account connected</b> bar in this picture only appears after you sign in with Google in Step 8."},
  check:"I copied the redirect URL from n8n."},
 {id:"g6", title:"Create the OAuth client in Google Cloud", why:"The client ID and secret identify your local n8n to Google.",
  do:["In Google Cloud open <b>APIs &amp; Services → Credentials</b>.","Choose <b>Create credentials → OAuth client ID</b>.","Application type: <b>Web application</b>. Name: <code>n8n local</code>.","Under <b>Authorized redirect URIs</b> choose <b>Add URI</b> and paste the URL you copied from n8n.","Choose <b>Create</b>. The <b>OAuth client created</b> dialog shows the <b>Client ID</b> and <b>Client secret</b>. Keep it open until you finish Step 7: Google won’t show the secret again after you close it. If you want a backup, choose <b>Download JSON</b>."],
  copy:[{t:"Client name",v:"n8n local"}], expect:"An “OAuth client created” dialog with a Client ID ending in <code>.apps.googleusercontent.com</code> and a Client secret.",
  img:{src:IMG_G6, w:"460px", alt:"Google Cloud dialog titled OAuth client created, with the Client ID and Client secret values hidden, a warning that the secret can no longer be viewed after closing the dialog, Status Enabled and a Download JSON button.", cap:"The <b>OAuth client created</b> dialog. Your Client ID and Client secret appear where the black boxes are; they are hidden in this picture because a secret must never be shared. Use the copy icons next to each value. <b>Download JSON</b> saves a backup copy to your computer."},
  check:"OAuth client created.", pf:"client", trouble:["redirect"]},
 {id:"g7", title:"Paste the Client ID and Client Secret into n8n", why:"n8n uses them to request access on your behalf.",
  do:["Copy the <b>Client ID</b> from the Google dialog and paste it into <b>Client ID</b> in n8n.","Copy the <b>Client secret</b> and paste it into <b>Client Secret</b> in n8n.","Treat the secret like a password. Don't share it or show it on a shared screen."],
  expect:"Both fields in the n8n credential are filled.", check:"Client ID and secret pasted.", trouble:["client"]},
 {id:"g8", title:"Sign in with Google and save", why:"This is the moment you grant your local n8n access to your sheets.",
  do:["In the n8n credential choose <b>Sign in with Google</b>.","Pick the account you added as a test user.","On “Google hasn't verified this app” choose <b>Continue</b>.","Allow the requested access. If Google shows checkboxes, tick them.","Back in n8n, rename the credential to <code>Google Sheets - Lab</code> and choose <b>Save</b>."],
  copy:[{t:"Credential name",v:"Google Sheets - Lab"}], expect:"n8n shows that the account is connected.",
  check:"Credential connected and saved.", trouble:["unverified","denied","redirect","signin","client"]},
 {id:"g9", title:"Test access to the spreadsheet", why:"Prove the whole chain works before building anything on it.",
  do:["Open your <code>00 - Scratch</code> workflow.","Add a node after Edit Fields: search <code>Google Sheets</code> and pick the action <b>Get row(s) in sheet</b>.","Set the fields as below and choose <b>Execute step</b>."],
  node:["Google Sheets","data"], config:[["Credential to connect with","Google Sheets - Lab"],["Resource","Sheet Within Document"],["Operation","Get Row(s)"],["Document","From list → AI Database Lab"],["Sheet","From list → STUDENTS"]],
  expect:"The output says <b>6 items</b>. Each item has <code>row_number</code> (added by n8n), <code>StudentID</code>, <code>Name</code>, <code>Major</code>, <code>GPA</code>, <code>Year</code> and <code>Status</code>. The first one is Sean, StudentID 1001.",
  img:{src:IMG_G9, w:"460px", alt:"Settings of the Get row(s) in sheet node: Credential, Resource Sheet Within Document, Operation Get Row(s), Document From list AI Database Lab, Sheet From list STUDENTS, with an Execute step button.", cap:"The node settings. Your credential may have a different name. Leave <b>Filters</b> and <b>Options</b> empty, then choose <b>Execute step</b>."},
  checks:[{id:"g9",label:"n8n can read my STUDENTS tab",env:"gs"}], trouble:["a1name","notlisted","driveapi","sheetsapi","norows"]}
 ]},

{id:"preflight", grp:"Setup", nav:"Pre-flight check", title:"Pre-flight check", time:"1 min", custom:"preflight"},

{id:"audit", grp:"Build", nav:"04 · Audit Logger", title:"Workflow 04: Audit Logger", time:"5 min", wf:true,
 intro:"We build the audit workflow first because the other three workflows call it. It takes a description of what happened and appends one row to AUDIT_LOG.",
 flow:[["",["When Executed by Another Workflow|trig","Add Timestamp|logic","Append to Audit Log|data","Return Success|logic"]]],
 teach:{notes:"Connect to the lecture: this is the audit table from the governance slide, built as a reusable component.", pause:"Pause after the append step so everyone sees a row arrive in the sheet.", mistakes:["Trigger input names with different capitalization from the guide.","Forgetting to turn on Include Other Input Fields, so the mapped values are empty.","Leaving test data pinned on the trigger."], ask:"Why are we using a separate Audit Logger workflow?", ans:"One place defines how logging works. Every workflow logs in the same format, and a change to logging is made once."},
 steps:[
 {id:"a1", title:"Create the workflow", why:"Each workflow in this lab has an exact name so the others can find it.",
  do:["From the Overview page choose <b>Create workflow</b>.","Rename it to the name below and save."], copy:[{t:"Workflow name",v:"04 - Audit Logger"}],
  expect:"An empty canvas named 04 - Audit Logger.", check:"Workflow created."},
 {id:"a2", title:"Add the sub-workflow trigger", why:"This trigger lets other workflows call this one and declares the inputs it expects.",
  do:["Add the first step and search <code>when executed by another workflow</code>.","Pick <b>When Executed by Another Workflow</b> (also listed as Execute Sub-workflow Trigger).","Set <b>Input data mode</b> to <b>Define using fields below</b>.","Under <b>Workflow Input Schema</b>, click <b>+</b> to add a field. Each field appears as <b>Values 1</b>, <b>Values 2</b> and so on. Type the <b>Name</b> and leave <b>Type</b> as <b>String</b>.","Repeat until you have the seven fields below, in this order.","Check the node's name on the canvas is exactly <code>"+TRG+"</code>. Rename it if your version shows something else, because later expressions use this name."],
  node:[TRG,"trig"], config:[["Input data mode","Define using fields below"],["Values 1, Name","user","c"],["Values 2, Name","workflow","c"],["Values 3, Name","action","c"],["Values 4, Name","recordId","c"],["Values 5, Name","oldValue","c"],["Values 6, Name","newValue","c"],["Values 7, Name","result","c"],["Type (all seven)","String"]],
  expect:"The trigger lists seven String inputs.", img:{src:IMG_A2, w:"420px", alt:"Trigger settings: Input data mode set to Define using fields below, Workflow Input Schema with Values 1 user, Values 2 workflow and Values 3 action, each of type String.", cap:"The first three of the seven fields. Click <b>+</b> next to <b>Workflow Input Schema</b> to add the next one. Names are case-sensitive: <code>recordId</code>, <code>oldValue</code> and <code>newValue</code> have a capital letter in the middle."}, check:"Seven inputs defined."},
 {id:"a3", title:"Give the trigger test data", why:"A sub-workflow normally gets its data from a parent. For testing on its own, we pin an example to the trigger.",
  do:["Open the trigger node."].concat(PIN),
  html:PINWARN,
  copy:[{t:"Test data (JSON)",v:'[\n  {\n    "user": "lab-user",\n    "workflow": "04 - Audit Logger",\n    "action": "TEST_ENTRY",\n    "recordId": "TEST",\n    "oldValue": "",\n    "newValue": "",\n    "result": "Manual test of the audit logger"\n  }\n]'}],
  extraHtml:VERNOTE, expect:"The trigger output shows one item with the seven fields and their test values, not <code>null</code>. The node has a pin icon.", check:"Test data is pinned and the trigger shows the test values.", trouble:["nulls"]},
 {id:"a4", title:"Add the timestamp", why:"An audit entry needs to say when it happened. The workflow sets the time itself so callers can't forget or fake it.",
  do:["Add <b>Edit Fields (Set)</b> after the trigger and rename it <code>Add Timestamp</code>.","Mode: <b>Manual Mapping</b>. Choose <b>Add Field</b> and fill it as below.",EFHOW,"Turn on <b>Include Other Input Fields</b> so the seven inputs pass through."],
  node:["Edit Fields (Set) → rename: Add Timestamp","logic"], config:[["Mode","Manual Mapping"],["Field name","timestamp","c"],["Type","String"],["Value","{{ $now.toISO() }}","cx"],["Include Other Input Fields","On"]],
  expect:"Execute the step: the output has eight fields, the seven inputs plus a timestamp like <code>2026-11-10T10:30:00.000-05:00</code>.", check:"Output has 8 fields.",
  trouble:["submap"]},
 {id:"a5", title:"Append the row to AUDIT_LOG", why:"This is the only place in the whole system that writes to the audit table.",
  do:["Add <b>Google Sheets</b> with the action <b>Append row in sheet</b>. Rename it <code>Append to Audit Log</code>.","Check that <b>Operation</b> says <b>Append Row</b>. If it says <b>Get Row(s)</b>, you picked the wrong action: change Operation to <b>Append Row</b>.","<b>Document:</b> From list → <code>AI Database Lab</code>.","<b>Sheet:</b> make sure the small selector on the left says <b>From list</b>, not <b>By ID</b>, and that the field is in <b>Fixed</b> mode. Then choose <code>AUDIT_LOG</code>.","<b>Mapping Column Mode</b> appears once the sheet is chosen. Set it to <b>Map Each Column Manually</b> and the eight column names appear under <b>Values to Send</b>. If it doesn't appear, or says “No columns found”, check the Sheet selector again. Switching Sheet to Expression doesn't help.","In the INPUT panel on the left, click <b>Execute previous nodes</b> so the eight fields from Add Timestamp appear. n8n may also show <i>“At least one value has to be added under ‘Values to Send’”</i>. That is expected: the columns are still empty.","For each column: hover over its field, switch it from <b>Fixed</b> to <b>Expression</b>, then paste the expression below. You can also drag each field from the input panel, which switches the field to Expression for you."],
  node:["Google Sheets → rename: Append to Audit Log","data"],
  config:[["Credential","Google Sheets - Lab"],["Operation","Append Row"],["Document","From list → AI Database Lab"],["Sheet","From list → AUDIT_LOG"],["Mapping Column Mode","Map Each Column Manually"],["Timestamp","{{ $json.timestamp }}","cx"],["User","{{ $json.user }}","cx"],["Workflow","{{ $json.workflow }}","cx"],["Action","{{ $json.action }}","cx"],["RecordID","{{ $json.recordId }}","cx"],["OldValue","{{ $json.oldValue }}","cx"],["NewValue","{{ $json.newValue }}","cx"],["Result","{{ $json.result }}","cx"]],
  expect:"Execute the step, then look at the AUDIT_LOG tab: a new row with TEST_ENTRY.", img:{src:IMG_A5, w:"480px", alt:"Values to Send in the Append to Audit Log node: each column in Expression mode, for example Timestamp set to {{ $json.timestamp }} with the preview 2026-11-11T23:41:06.768-05:00, User lab-user, Workflow 04 - Audit Logger, Action TEST_ENTRY, RecordID TEST, OldValue and NewValue empty.", cap:"Correctly mapped columns. Each field shows the <b>fx</b> marker (Expression mode), the expression in green, and the value it produces underneath. <code>[empty]</code> under OldValue and NewValue is correct for the test entry."},
  extraHtml:`<div class="blk"><label>Drag and drop instead of typing</label><div class="scroll"><table class="cfg"><tr><td>Drag input field</td><td><b>onto column</b></td></tr><tr><td><code>timestamp</code></td><td>Timestamp</td></tr><tr><td><code>user</code></td><td>User</td></tr><tr><td><code>workflow</code></td><td>Workflow</td></tr><tr><td><code>action</code></td><td>Action</td></tr><tr><td><code>recordId</code></td><td>RecordID</td></tr><tr><td><code>oldValue</code></td><td>OldValue</td></tr><tr><td><code>newValue</code></td><td>NewValue</td></tr><tr><td><code>result</code></td><td>Result</td></tr></table></div></div>`,
  check:"A TEST_ENTRY row appeared in AUDIT_LOG.", trouble:["emptyvals","wrongop","tabname","colname","sheetsapi"]},
 {id:"a6", title:"Return a confirmation", why:"A sub-workflow hands the output of its last node back to the caller. We return a small, predictable result.",
  do:["Add <b>Edit Fields (Set)</b> and rename it <code>Return Success</code>.","Mode: <b>Manual Mapping</b>. Choose <b>Add Field</b> four times and fill each field as below. Leave <b>Include Other Input Fields</b> off.",EFHOW],
  node:["Edit Fields (Set) → rename: Return Success","logic"],
  config:[["Field 1: Name","logged","c"],["Field 1: Type","Boolean"],["Field 1: Value","true"],["Field 2: Name","action","c"],["Field 2: Type","String"],["Field 2: Value","{{ $('Add Timestamp').first().json.action }}","cx"],["Field 3: Name","result","c"],["Field 3: Type","String"],["Field 3: Value","{{ $('Add Timestamp').first().json.result }}","cx"],["Field 4: Name","timestamp","c"],["Field 4: Type","String"],["Field 4: Value","{{ $('Add Timestamp').first().json.timestamp }}","cx"]],
  expect:"One output item: <code>logged: true</code>, <code>action: TEST_ENTRY</code>, the result text and the timestamp.", check:"Return Success outputs four fields.", trouble:["efname","nodename"]},
 {id:"a7", title:"Unpin, save and publish", why:"Pinned data is only for testing. Other workflows run the <b>published</b> version of this workflow, so it must be published before anything can call it.",
  do:["Open the trigger node and unpin the data (click the pin, or choose Unpin).","Choose <b>Save</b>.","Click <b>Publish</b> at the top right. Without this, callers get <i>“Workflow is not active and cannot be executed”</i>.","You can delete the TEST_ENTRY row from the sheet or keep it."],
  html:`<div class="warn"><b>Do this at the end of every sub-workflow</b><span>Unpin, save, then <b>Publish</b>. If you change a sub-workflow later, publish it again: callers always run the last published version. Don't run the workflow again after unpinning: with no parent workflow sending data, every input is <code>null</code>. For the Audit Logger that also writes an almost empty row to AUDIT_LOG. If that happens, delete that row in Google Sheets. Workflows 02, 03 and 05 end the same way.</span></div>`,
  expect:"The trigger has no pin, the workflow is saved and shows as published. You don't need to run workflow 04 on its own again: it runs whenever workflows 02, 03 and 05 call it.", check:"Unpinned, saved and published.", trouble:["notactive","nulls","pinned"]}
 ]},

{id:"query", grp:"Build", nav:"02 · Query Filter Sort", title:"Workflow 02: Query, Filter, Sort", time:"8 min", wf:true,
 intro:"A read-only operation: get the students, keep the ones that match, order them, log the read and return the result. Goal: Software Development students with GPA of at least 3.5, highest GPA first.",
 flow:[["",["When Executed by Another Workflow|trig","Get Students|data","Filter Students|logic","Sort by GPA|logic","Collect Records|logic","Log Query|sub","Return Records|logic"]]],
 teach:{notes:"Relate each node to SQL: Get Rows is FROM, Filter is WHERE, Sort is ORDER BY. Write the SQL on the board next to the canvas.", pause:"Pause on the Filter output and open the Discarded tab.", mistakes:["Comparing GPA as a String.","Typing $json.gpa in lower case.","Skipping Collect Records, which writes one audit row per student."], ask:"What SQL statement does this workflow correspond to?", ans:"SELECT * FROM STUDENTS WHERE Major = 'Software Development' AND GPA >= 3.5 ORDER BY GPA DESC;"},
 steps:[
 {id:"q1", title:"Create the workflow and its trigger", why:"The trigger declares the query parameters a caller may send.",
  do:["Create a workflow with the name below.","Add <b>When Executed by Another Workflow</b>. Input data mode: <b>Define using fields below</b>.","Add four fields. Set <code>minimumGpa</code> to type <b>Number</b>. The others stay String."].concat(PIN),
  html:PINWARN,
  node:[TRG,"trig"], copy:[{t:"Workflow name",v:"02 - Query Filter Sort Data"},{t:"Test data (JSON)",v:'[\n  {\n    "dataset": "STUDENTS",\n    "major": "Software Development",\n    "minimumGpa": 3.5,\n    "sortDirection": "DESC"\n  }\n]'}],
  config:[["Field 1 (String)","dataset","c"],["Field 2 (String)","major","c"],["Field 3 (Number)","minimumGpa","c"],["Field 4 (String)","sortDirection","c"]],
  expect:"The trigger output shows one pinned item: <code>major: Software Development</code>, <code>minimumGpa: 3.5</code> (a number, without quotes), not <code>null</code>.", check:"Trigger has four inputs and pinned test data.", trouble:["nulls"]},
 {id:"q2", title:"Read the STUDENTS table", why:"Every query starts by reading from the source of truth.",
  do:["Add <b>Google Sheets</b> with the action <b>Get row(s) in sheet</b>. Rename it <code>Get Students</code>.","Don't add a filter in this node. We filter in the next step so you can see what was removed."],
  node:["Google Sheets → rename: Get Students","data"], config:[["Credential","Google Sheets - Lab"],["Operation","Get Row(s)"],["Document","From list → AI Database Lab"],["Sheet","From list → STUDENTS"]],
  expect:"Input: 1 item from the trigger. Output: 6 items, one per student.", check:"Get Students returns 6 items.", trouble:["norows","notlisted"]},
 {id:"q3", title:"Filter by major and minimum GPA", why:"Filter keeps the items that pass every condition and discards the rest. This is the WHERE clause.",
  do:["Add <b>Filter</b> and rename it <code>Filter Students</code>.","Condition 1: paste the left value, choose <b>String → is equal to</b>, paste the right value.","Choose <b>Add condition</b> and keep the combinator on <b>AND</b>.","Condition 2: paste the left value, choose <b>Number → is greater than or equal to</b>, paste the right value."],
  node:["Filter → rename: Filter Students","logic"],
  config:[["Condition 1, left","{{ $json.Major }}","cx"],["Condition 1, operator","String → is equal to"],["Condition 1, right","{{ "+T+".major }}","cx"],["Combine","AND"],["Condition 2, left","{{ $json.GPA }}","cx"],["Condition 2, operator","Number → is greater than or equal to"],["Condition 2, right","{{ "+T+".minimumGpa }}","cx"]],
  expect:"Input: 6 items. Kept: 2 items (Sean 3.9 and Jessica 3.7). Discarded: 4 items.", img:{src:IMG_Q3, alt:"Filter Students node: condition 1 {{ $json.Major }} is equal to the trigger major, AND, condition 2 {{ $json.GPA }} is greater than or equal to the trigger minimumGpa, both with a check mark. Output: Kept (2 items) Sean 3.9 and Jessica 3.7, Discarded (4 items).", cap:"A working filter. Both conditions have a ✓ on the right, and the output shows <b>Kept (2 items)</b>, Sean and Jessica, and <b>Discarded (4 items)</b>. Leave <b>Convert types where required</b> off."},
  check:"Filter keeps exactly Sean and Jessica.", trouble:["filterall","textnum","colname","nodename"]},
 {id:"q4", title:"Sort by GPA, highest first", why:"Sort puts the items in a defined order. This is ORDER BY.",
  do:["Add <b>Sort</b> and rename it <code>Sort by GPA</code>.","Type: <b>Simple</b>. Choose <b>Add Field To Sort By</b>."],
  node:["Sort → rename: Sort by GPA","logic"], config:[["Type","Simple"],["Field Name","GPA","c"],["Order","Descending"]],
  extraHtml:`<details><summary>Optional: make the order follow the sortDirection input</summary><div class="d-in"><p>Hover the Order dropdown, switch it to <b>Expression</b> and paste the line below. It selects ascending only when the caller sends <code>ASC</code>. Check the result in your version before relying on it.</p>__COPY__</div></details>`,
  extraCopy:{t:"Order as an expression",v:"{{ "+T+".sortDirection === 'ASC' ? 'ascending' : 'descending' }}"},
  expect:"Output: 2 items in this order: Sean (3.9), then Jessica (3.7).", check:"Sean is first, Jessica second."},
 {id:"q5", title:"Collect the records into one item", why:"The next node logs the query. n8n runs a node once per item, so two student items would write two audit rows. One item gives one log entry.",
  do:["Add <b>Aggregate</b> and rename it <code>Collect Records</code>."],
  node:["Aggregate → rename: Collect Records","logic"], config:[["Aggregate","All Item Data (Into a Single List)"],["Put Output in Field","records","c"]],
  expect:"Input: 2 items. Output: 1 item with a <code>records</code> list that holds both students.", check:"One item with a records list of 2."},
 {id:"q6", title:"Log the read with the Audit Logger", why:"Reads are logged too. An audit trail should show who looked at data as well as who changed it.",
  do:["Add <b>Execute Sub-workflow</b> and rename it <code>Log Query</code>.","Source: <b>Database</b>. Workflow: <b>From list</b> → <code>04 - Audit Logger</code>.","The seven inputs of the logger appear under <b>Workflow Inputs</b>. Fill them as below. Leave oldValue and newValue empty."],
  node:["Execute Sub-workflow → rename: Log Query","sub"],
  config:[["Source","Database"],["Workflow","From list → 04 - Audit Logger"],["user","lab-user","c"],["workflow","02 - Query Filter Sort Data","c"],["action","READ_FILTER_SORT","c"],["recordId","{{ "+T+".dataset }}","cx"],["oldValue","(leave empty)"],["newValue","(leave empty)"],["result","{{ 'Returned ' + $json.records.length + ' record(s) for ' + "+T+".major + ', GPA >= ' + "+T+".minimumGpa }}","cx"],["Mode","Run once with all items"],["Options → Wait for Sub-Workflow Completion","On (default)"]],
  expect:"Execute the step. Output: <code>logged: true</code>, <code>action: READ_FILTER_SORT</code>. AUDIT_LOG has a new row that says “Returned 2 record(s) for Software Development, GPA &gt;= 3.5”.",
  img:{src:IMG_Q6, alt:"Log Query node: recordId set to the trigger dataset (preview STUDENTS), oldValue and newValue empty, result expression with preview Returned 2 record(s) for Software Development, GPA >= 3.5, Mode Run once with all items, Wait For Sub-Workflow Completion on. Output: 1 item, 1 sub-execution, logged true, action READ_FILTER_SORT.", cap:"The lower half of the Log Query node after a successful run. Under each expression n8n previews its value, for example <code>STUDENTS</code> and <i>Returned 2 record(s) for Software Development, GPA &gt;= 3.5</i>. oldValue and newValue stay empty. <b>Mode</b> is <b>Run once with all items</b> and <b>Wait For Sub-Workflow Completion</b> is on. The output says <b>1 item, 1 sub-execution</b>; click <b>View sub-execution</b> to open the run inside the Audit Logger."},
  check:"A READ_FILTER_SORT row is in AUDIT_LOG.", trouble:["sublist","subinput","submap","pinned"]},
 {id:"q7", title:"Return the filtered records", why:"The caller wants the students, and the last node currently outputs the audit confirmation. This node returns the records instead.",
  do:["Add <b>Edit Fields (Set)</b> and rename it <code>Return Records</code>.","Mode: <b>Manual Mapping</b>. Choose <b>Add Field</b> twice and fill each field as below.",EFHOW],
  node:["Edit Fields (Set) → rename: Return Records","logic"],
  config:[["Field 1: Name","count","c"],["Field 1: Type","Number"],["Field 1: Value","{{ $('Collect Records').first().json.records.length }}","cx"],["Field 2: Name","records","c"],["Field 2: Type","Array"],["Field 2: Value","{{ $('Collect Records').first().json.records }}","cx"]],
  expect:"One item: <code>count: 2</code> and <code>records</code> with Sean first and Jessica second.", check:"Return Records outputs count 2 and both students.", trouble:["efname","nodename"]},
 {id:"q8", title:"Unpin, save and publish", why:"The router will send the real parameters, and it runs the published version of this workflow.", do:["Open the trigger and unpin the test data.","Save the workflow. Don't run it again on its own: without pinned data every input is <code>null</code>.","Click <b>Publish</b> at the top right."], expect:"No pin on the trigger. Workflow saved and published.", check:"Unpinned, saved and published.", trouble:["notactive"]}
 ]},

{id:"update", grp:"Build", nav:"03 · Controlled Update", title:"Workflow 03: Controlled Data Update", time:"8–9 min", wf:true,
 intro:"A write operation with guards. The workflow changes an assignment's Status only if the record exists and the new value is allowed. Every attempt, successful or not, is logged.",
 flow:[["main",["When Executed by Another Workflow|trig","Find Assignment|data","Record Exists?|logic","Status Allowed?|logic","Update Status|data","Prepare Success|logic"]],["not found",["Record Exists? (false)|logic","Prepare Not Found|logic"]],["invalid",["Status Allowed? (false)|logic","Prepare Invalid|logic"]],["all three",["Prepare …|logic","Log Update|sub","Return Result|logic"]]],
 teach:{notes:"This is the DELETE-question slide in practice: writes get validation and a human-readable trail. Point out that the allowed list is enforced by the workflow, not by the caller.", pause:"Pause after each If node and run the step so students see the true and false outputs.", mistakes:["Forgetting Always Output Data on Find Assignment, so a missing record stops the workflow silently.","Pasting the JSON while the field is in Fixed mode.","Connecting only one Prepare node to Log Update."], ask:"Why do we validate the new status before updating the spreadsheet?", ans:"To protect data integrity and prevent unsupported values from entering the dataset."},
 steps:[
 {id:"u1", title:"Create the workflow and its trigger", why:"The caller sends which assignment to change and the status it wants.",
  do:["Create a workflow with the name below.","Add <b>When Executed by Another Workflow</b>. Input data mode: <b>Define using fields below</b>, with the two String fields below."].concat(PIN),
  html:PINWARN,
  node:[TRG,"trig"], copy:[{t:"Workflow name",v:"03 - Controlled Data Update"},{t:"Test data (JSON)",v:'[\n  {\n    "assignmentId": "A003",\n    "newStatus": "Completed"\n  }\n]'}],
  config:[["Field 1 (String)","assignmentId","c"],["Field 2 (String)","newStatus","c"]], expect:"One pinned item with <code>assignmentId: A003</code> and <code>newStatus: Completed</code>, not <code>null</code>.", check:"Trigger ready with pinned test data.", trouble:["nulls"]},
 {id:"u2", title:"Retrieve the record", why:"Read before you write. This confirms the row exists and captures its current Status.",
  do:["Add <b>Google Sheets</b> with <b>Get row(s) in sheet</b>. Rename it <code>Find Assignment</code>.","Under <b>Filters</b> choose <b>Add Filter</b> and set the column and value below.","Open the node's <b>Settings</b> tab and turn on <b>Always Output Data</b>. Without it, a missing record would stop the workflow with no message and no audit entry."],
  node:["Google Sheets → rename: Find Assignment","data"], config:[["Operation","Get Row(s)"],["Document","From list → AI Database Lab"],["Sheet","From list → ASSIGNMENTS"],["Filters → Column","AssignmentID"],["Filters → Value","{{ $json.assignmentId }}","cx"],["Settings → Always Output Data","On"]],
  expect:"One item: A003, CYB3100, Security Analysis, Status Open.", check:"Find Assignment returns the A003 row.", trouble:["norows","colname"]},
 {id:"u3", title:"Check that the record exists", why:"First guard. An update to a record that isn't there must stop here.",
  do:["Add <b>If</b> and rename it <code>Record Exists?</code>."],
  node:["If → rename: Record Exists?","logic"], config:[["Left value","{{ $json.AssignmentID }}","cx"],["Operator","String → is not empty"]],
  expect:"With A003 the item leaves through the <b>true</b> output.", check:"A003 goes to the true output."},
 {id:"u4", title:"Handle “record not found”", why:"A failure is a result too. We prepare a clear message and an audit entry.",
  do:["From the <b>false</b> output of Record Exists?, add <b>Edit Fields (Set)</b>. Rename it <code>Prepare Not Found</code>.","Mode: <b>JSON</b> (may appear as JSON Output).","Switch the JSON field to <b>Expression</b>, then paste the block below."],
  node:["Edit Fields (Set) → rename: Prepare Not Found","logic"],
  copy:[{t:"JSON for Prepare Not Found",v:'{\n  "action": "FAILED_UPDATE",\n  "recordId": "{{ '+T+'.assignmentId }}",\n  "oldValue": "",\n  "newValue": "{{ '+T+'.newStatus }}",\n  "result": "Record not found."\n}'}],
  expect:"Nothing runs through this branch yet. You will test it in the last step.", check:"Prepare Not Found is connected to the false output."},
 {id:"u5", title:"Check that the new status is allowed", why:"Second guard. Only three values may ever be written to the Status column.",
  do:["From the <b>true</b> output of Record Exists?, add another <b>If</b>. Rename it <code>Status Allowed?</code>."],
  node:["If → rename: Status Allowed?","logic"], copy:[{t:"Allowed values",v:"Open, Completed, Late"}],
  config:[["Left value","{{ ['Open','Completed','Late'].includes("+T+".newStatus) }}","cx"],["Operator","Boolean → is true"]],
  expect:"With newStatus Completed the item leaves through the <b>true</b> output.", check:"Completed goes to the true output."},
 {id:"u6", title:"Handle “invalid status”", why:"The value is rejected before it can reach the sheet.",
  do:["From the <b>false</b> output of Status Allowed?, add <b>Edit Fields (Set)</b>. Rename it <code>Prepare Invalid</code>.","Mode: <b>JSON</b>. Switch the field to <b>Expression</b> and paste the block below."],
  node:["Edit Fields (Set) → rename: Prepare Invalid","logic"],
  copy:[{t:"JSON for Prepare Invalid",v:'{\n  "action": "VALIDATION_FAILED",\n  "recordId": "{{ '+T+'.assignmentId }}",\n  "oldValue": "{{ $(\'Find Assignment\').first().json.Status }}",\n  "newValue": "{{ '+T+'.newStatus }}",\n  "result": "Invalid status."\n}'}],
  expect:"Connected to the false output. Tested in the last step.", check:"Prepare Invalid is connected."},
 {id:"u7", title:"Update the row", why:"Only requests that passed both guards reach this node.",
  do:["From the <b>true</b> output of Status Allowed?, add <b>Google Sheets</b> with <b>Update row in sheet</b>. Rename it <code>Update Status</code>.","Check that <b>Operation</b> says <b>Update Row</b>. <b>Document:</b> From list → <code>AI Database Lab</code>. <b>Sheet:</b> set the selector to <b>From list</b> (not By ID) and choose <code>ASSIGNMENTS</code>.","Mapping Column Mode: <b>Map Each Column Manually</b>. Column to match on: <b>AssignmentID</b>.","Fill AssignmentID and Status as below. Remove the other columns from the mapping, or leave them empty, so they aren't changed."],
  node:["Google Sheets → rename: Update Status","data"],
  config:[["Operation","Update Row"],["Document","From list → AI Database Lab"],["Sheet","From list → ASSIGNMENTS"],["Mapping Column Mode","Map Each Column Manually"],["Column to match on","AssignmentID"],["AssignmentID (using to match)","{{ $json.AssignmentID }}","cx"],["Status","{{ "+T+".newStatus }}","cx"]],
  expect:"Execute the step: in the ASSIGNMENTS tab, A003 now has Status Completed. Other columns are unchanged.", check:"A003 is Completed in the sheet.", trouble:["wrongop"]},
 {id:"u8", title:"Prepare the success entry", why:"We record the old and new value. The old status was captured when Find Assignment read the row, and n8n keeps each node's output for the whole execution.",
  do:["After Update Status add <b>Edit Fields (Set)</b>. Rename it <code>Prepare Success</code>.","Mode: <b>JSON</b>. Switch the field to <b>Expression</b> and paste the block below."],
  node:["Edit Fields (Set) → rename: Prepare Success","logic"],
  copy:[{t:"JSON for Prepare Success",v:'{\n  "action": "UPDATE_STATUS",\n  "recordId": "{{ '+T+'.assignmentId }}",\n  "oldValue": "{{ $(\'Find Assignment\').first().json.Status }}",\n  "newValue": "{{ '+T+'.newStatus }}",\n  "result": "Status changed from {{ $(\'Find Assignment\').first().json.Status }} to {{ '+T+'.newStatus }}."\n}'}],
  expect:"One item with action UPDATE_STATUS, oldValue Open, newValue Completed. If it says <i>from Completed to Completed</i>, A003 was already changed by an earlier run: type <code>Open</code> back into A003’s Status in the ASSIGNMENTS tab and run again.", check:"Prepare Success shows old and new value.", trouble:["nodename"]},
 {id:"u9", title:"Log every outcome", why:"One audit node serves all three branches, so failed attempts are recorded exactly like successful ones.",
  do:["After Prepare Success add <b>Execute Sub-workflow</b>. Rename it <code>Log Update</code>. Choose <code>04 - Audit Logger</code>.","Fill the inputs as below.","Drag a connection from <b>Prepare Not Found</b> to Log Update, and another from <b>Prepare Invalid</b> to Log Update. The node now has three incoming lines. Only one branch runs per execution."],
  node:["Execute Sub-workflow → rename: Log Update","sub"],
  config:[["Workflow","From list → 04 - Audit Logger"],["user","lab-user","c"],["workflow","03 - Controlled Data Update","c"],["action","{{ $json.action }}","cx"],["recordId","{{ $json.recordId }}","cx"],["oldValue","{{ $json.oldValue }}","cx"],["newValue","{{ $json.newValue }}","cx"],["result","{{ $json.result }}","cx"]],
  expect:"Three lines lead into Log Update.", img:{src:IMG_U9, alt:"Workflow 03 canvas: Status Allowed? true output goes to Update Status, then Prepare Success; the false output goes to Prepare Invalid; Prepare Not Found sits below. Lines from Prepare Success, Prepare Invalid and Prepare Not Found all lead into Log Update. The success path is green with 1 item on each line.", cap:"The finished canvas after the successful test. Three lines lead into <b>Log Update</b>: from Prepare Success, Prepare Invalid and Prepare Not Found. Only the path that ran is green (here the success path, with <b>1 item</b> on each line); the other two stay grey until you test them in Step 11."}, check:"All three Prepare nodes connect to Log Update.", trouble:["subinput","submap"]},
 {id:"u10", title:"Return the confirmation", why:"The caller gets a short, consistent answer for every outcome.",
  do:["After Log Update add <b>Edit Fields (Set)</b>. Rename it <code>Return Result</code>. Mode: <b>Manual Mapping</b>. Choose <b>Add Field</b> three times and fill each field as below.",EFHOW,"<b>Field 1 is a Boolean</b>, so its value box is a <b>true/false dropdown</b> and you can't paste into it. Hover over the dropdown, click <b>Expression</b> in the small Fixed | Expression switch, then paste the expression. The preview should say <code>true</code>."],
  node:["Edit Fields (Set) → rename: Return Result","logic"],
  config:[["Field 1: Name","success","c"],["Field 1: Type","Boolean"],["Field 1: Value","{{ $json.action === 'UPDATE_STATUS' }}","cx"],["Field 2: Name","action","c"],["Field 2: Type","String"],["Field 2: Value","{{ $json.action }}","cx"],["Field 3: Name","message","c"],["Field 3: Type","String"],["Field 3: Value","{{ $json.result }}","cx"]],
  expect:"Ready to test.", check:"Return Result added.", trouble:["efname"]},
 {id:"u11", title:"Test all three paths, then reset", why:"A guard you haven't seen fail is a guard you can't trust.",
  do:["Choose <b>Execute workflow</b>. Result: success true, “Status changed from Open to Completed.”","Open the trigger, edit the pinned data, change <code>newStatus</code> to <code>Deleted</code> and run again. Result: “Invalid status.” The sheet is unchanged.","Edit the pinned data again: <code>assignmentId</code> <code>A999</code>, <code>newStatus</code> <code>Completed</code>. Run. Result: “Record not found.”","In the ASSIGNMENTS tab, type <code>Open</code> back into A003's Status so the final tests start clean.","Unpin the trigger data, save the workflow and click <b>Publish</b>."],
  expect:"AUDIT_LOG has three new rows: UPDATE_STATUS, VALIDATION_FAILED and FAILED_UPDATE. A003 is back to Open.", check:"All three paths work, A003 is reset, workflow unpinned, saved and published.", trouble:["nooutput","pinned","notactive"]}
 ]},

{id:"report", grp:"Build", nav:"05 · Reporting", title:"Workflow 05: Reporting and Aggregation", time:"7 min", wf:true,
 intro:"Turn rows into metrics: totals, counts and averages per major, highest and lowest GPA. Grouping uses a native node. One short Code node assembles the final report.",
 flow:[["",["When Executed by Another Workflow|trig","Get Students|data","Stats by Major|logic","Sort by Average|logic","Build Report|code","Log Report|sub","Return Report|logic"]]],
 teach:{notes:"Summarize is GROUP BY with aggregate functions. Show SELECT Major, COUNT(*), AVG(GPA) FROM STUDENTS GROUP BY Major next to the node.", pause:"Pause on the Summarize output and ask what 3.4000000000000004 means.", mistakes:["Typing the split field as “major”.","Renaming Get Students, which breaks the Code node.","Typing the code by hand."], ask:"Why might the average show 3.4000000000000004?", ans:"Floating-point arithmetic. Decimals like 3.6 and 3.2 can't be stored exactly in binary, so their average comes out as 3.4000000000000004. Reports should round for display, which the Code node does."},
 steps:[
 {id:"r1", title:"Create the workflow and its trigger", why:"The report takes one input so callers can say which report they want.",
  do:["Create a workflow with the name below.","Add <b>When Executed by Another Workflow</b>. Input data mode: <b>Define using fields below</b>, with the one String field below."].concat(PIN),
  html:PINWARN,
  node:[TRG,"trig"], copy:[{t:"Workflow name",v:"05 - Reporting and Aggregation"},{t:"Test data (JSON)",v:'[\n  {\n    "reportType": "STUDENT_SUMMARY"\n  }\n]'}],
  config:[["Field 1 (String)","reportType","c"]], expect:"One pinned item with <code>reportType: STUDENT_SUMMARY</code>, not <code>null</code>.", check:"Trigger ready with pinned test data.", trouble:["nulls"]},
 {id:"r2", title:"Read the STUDENTS table", why:"Reports are computed from the stored rows every time, so they are always current.",
  do:["Add <b>Google Sheets</b> with <b>Get row(s) in sheet</b>. Rename it exactly <code>Get Students</code>. The Code node later uses this name."],
  node:["Google Sheets → rename: Get Students","data"], config:[["Operation","Get Row(s)"],["Document","From list → AI Database Lab"],["Sheet","From list → STUDENTS"]],
  expect:"6 items.", check:"Get Students returns 6 items."},
 {id:"r3", title:"Group and aggregate by major", why:"Summarize groups items and calculates values per group. This is GROUP BY with COUNT and AVG.",
  do:["Add <b>Summarize</b> and rename it <code>Stats by Major</code>.","Under <b>Fields to Summarize</b> add two entries as below.","Set <b>Fields to Split By</b> to <code>Major</code>."],
  node:["Summarize → rename: Stats by Major","logic"], config:[["Summarize 1, Aggregation","Count"],["Summarize 1, Field","StudentID","c"],["Summarize 2, Aggregation","Average"],["Summarize 2, Field","GPA","c"],["Fields to Split By","Major","c"]],
  expect:"3 items: Software Development (count 2, average about 3.8), Cybersecurity (2, about 3.4), IT (2, about 3.15). The new fields are named <code>count_StudentID</code> and <code>average_GPA</code>. A value like 3.4000000000000004 is normal.",
  img:{src:IMG_R3, alt:"Stats by Major (Summarize) node: Fields to Summarize 1 Aggregation Count Field StudentID, 2 Aggregation Average Field GPA, Fields to Split By Major. Output 3 items: Software Development count_StudentID 2 average_GPA 3.8, Cybersecurity 2 and 3.4000000000000004, IT 2 and 3.15.", cap:"The finished Summarize node and its output. The new fields are named <code>count_StudentID</code> and <code>average_GPA</code>. Cybersecurity shows <code>3.4000000000000004</code> instead of 3.4: that is normal floating-point rounding, and the Build Report step rounds it."}, check:"Three majors with counts and averages.", trouble:["colname","textnum"]},
 {id:"r4", title:"Sort majors by average GPA", why:"Reports are easier to read with the highest value first.",
  do:["Click the <b>+</b> on the right side of <b>Stats by Major</b> (not Get Students) and add <b>Sort</b>. Rename it <code>Sort by Average</code>.","Check the chain on the canvas: <b>Get Students → Stats by Major → Sort by Average</b>. In the Sort node’s INPUT panel, the top node must be <b>Stats by Major</b> with 3 items.","For the field name, drag the average field from the input panel or type <code>average_GPA</code>."],
  node:["Sort → rename: Sort by Average","logic"], config:[["Type","Simple"],["Field Name","average_GPA","c"],["Order","Descending"]],
  expect:"Software Development first, then Cybersecurity, then IT.", check:"Majors are ordered by average GPA.", trouble:["sortfield"]},
 {id:"r5", title:"Build the report object", why:"Totals, highest and lowest need all rows at once, and the caller wants one tidy object. A short Code node is the simplest way to do that. Copy it; don't type it.",
  do:["Add <b>Code</b> and rename it exactly <code>Build Report</code>.","Mode: <b>Run Once for All Items</b>. Language: <b>JavaScript</b>.","Delete the example code and paste the block below."],
  node:["Code → rename: Build Report","code"], copy:[{t:"JavaScript for Build Report",v:CODE}],
  expect:`One item:<div class="scroll"><pre style="margin:6px 0 0;font-size:13px">totalStudents: 6      activeStudents: 5      inactiveStudents: 1
highestGPA: Sean 3.9  lowestGPA: Mike 2.9
byMajor: Software Development { students: 2, averageGPA: 3.8 }
         Cybersecurity        { students: 2, averageGPA: 3.4 }
         IT                   { students: 2, averageGPA: 3.15 }</pre></div>`,
  check:"My report numbers match.", trouble:["nodename","colname"]},
 {id:"r6", title:"Log the report", why:"Generating a report is a data access event, so it goes in the audit trail.",
  do:["Add <b>Execute Sub-workflow</b>, rename it <code>Log Report</code> and choose <code>04 - Audit Logger</code>."],
  node:["Execute Sub-workflow → rename: Log Report","sub"],
  config:[["Workflow","From list → 04 - Audit Logger"],["user","lab-user","c"],["workflow","05 - Reporting and Aggregation","c"],["action","GENERATE_REPORT","c"],["recordId","STUDENTS","c"],["oldValue","(leave empty)"],["newValue","(leave empty)"],["result","{{ 'Report generated for ' + $json.totalStudents + ' students' }}","cx"]],
  expect:"AUDIT_LOG gets a GENERATE_REPORT row: “Report generated for 6 students”.", check:"GENERATE_REPORT row is in AUDIT_LOG.", trouble:["subinput","submap"]},
 {id:"r7", title:"Return the report, unpin, save and publish", why:"The last node decides what the caller receives.",
  do:["Add <b>Edit Fields (Set)</b> and rename it <code>Return Report</code>. Mode: <b>Manual Mapping</b>. Choose <b>Add Field</b> once and fill it as below.",EFHOW,"Execute the workflow once to check it.","Unpin the trigger data, save and click <b>Publish</b>."],
  node:["Edit Fields (Set) → rename: Return Report","logic"], config:[["Field 1: Name","report","c"],["Field 1: Type","Object"],["Field 1: Value","{{ $('Build Report').first().json }}","cx"]],
  expect:"One item with a <code>report</code> object that holds all the metrics.", check:"Report returned, workflow unpinned, saved and published.", trouble:["efname","notactive"]}
 ]},

{id:"ai", grp:"Build", nav:"AI Summary", title:"AI Summary", time:"5 min", wf:true, optional:true,
 intro:"Your instructor gives you the API key for this section in class. It is not on this website. Everything else works without it." + " The AI only reads the finished report and writes three sentences about it. It never writes to the spreadsheet.",
 pre:`<div class="warn"><b>Getting and protecting the API key</b><span>Your instructor shares the key in class. It is not published on this website. Paste it only into the n8n credential. Never type it into a node field, a prompt or a workflow name, never post or share it, and never show it on a projected screen. The key works only for this class and is switched off afterwards.</span></div>`,
 teach:{notes:"Hand out the class API key now (board, course page or chat), never on the projector. Revoke it in the OpenAI dashboard after class. Tie this section to grounding: the model receives the computed numbers and is told to use only those. Compare the summary with the report on screen.", pause:"Don't wait for everyone here. It is optional.", mistakes:["Pasting the API key into the prompt.","Placing the AI node before Build Report."], ask:"Why shouldn't the AI have unrestricted write access?", ans:"A model's output is probabilistic. Writes must go through the same validation and audit path as any other request, so an incorrect or manipulated output can't change the data."},
 steps:[
 {id:"ai1", title:"Add an OpenAI credential", why:"n8n stores the key encrypted and keeps it out of your workflow.",
  do:["Get the class API key from your instructor. It is handed out in class, not on this website.","In n8n open <b>Credentials → Create credential</b> and search <code>OpenAI</code>.","Paste the key into <b>API Key</b>, rename the credential to <code>OpenAI - Class</code> and save. Do this on your own screen, not on a shared one."], copy:[{t:"Credential name",v:"OpenAI - Class"}],
  expect:"n8n reports that the credential was tested successfully.", check:"OpenAI credential saved with the class key.", trouble:["aikey","aiquota"]},
 {id:"ai2", title:"Add the AI node to workflow 05", why:"The model summarizes the report after the numbers have been computed by the database workflow.",
  do:["Open <code>05 - Reporting and Aggregation</code>.","Click the <b>+</b> on the line between <b>Log Report</b> and <b>Return Report</b> and add the <b>OpenAI</b> node.","Choose the text action <b>Message a model</b>. Some versions call it <b>Generate a Chat Completion</b>.","Pick a small model, add one message with role <b>User</b> and paste the prompt below with the field in <b>Expression</b> mode.","Rename the node <code>Summarize Report</code>."],
  node:["OpenAI → rename: Summarize Report","ai"], config:[["Resource","Text"],["Operation","Message a model"],["Model","gpt-4o-mini (or another small model)"],["Role","User"],["Simplify Output","On"]],
  copy:[{t:"Prompt",v:PROMPT,wrap:true}], extraHtml:VERNOTE,
  expect:"Execute the step: the output contains three sentences that mention Software Development (3.8), six students and one observation. Every number matches the report.", check:"The summary only uses numbers from the report."},
 {id:"ai3", title:"Return the summary with the report", why:"The caller receives the facts and the explanation together, and can check one against the other.",
  do:["Open <b>Return Report</b> and choose <b>Add Field</b>. Name: <code>aiSummary</code>. Type: <b>String</b>.","For the Value, find the AI’s answer in the INPUT panel: <b>output → output[0] → content → content[0] → text</b>. Drag that <code>text</code> field into the Value box. Or switch the Value box to <b>Expression</b> and paste the expression below.","Choose <b>Execute step</b>, then save the workflow and click <b>Publish</b> again, because workflow 05 changed."],
  config:[["Field 2: Name","aiSummary","c"],["Field 2: Type","String"],["Field 2: Value","{{ $json.output[0].content[0].text }}","cx"]],
  extraHtml:'<p class="note" style="font-size:15px">If your AI node’s output looks different (for example a <code>message → content</code> field instead), drag whichever field holds the answer text. The path depends on the n8n version and on the <b>Simplify Output</b> setting.</p>',
  expect:"The output has two fields: <code>report</code> with the metrics, and <code>aiSummary</code> with the AI’s sentences, for example “The major with the highest average GPA is Software Development, with an average of 3.8…”.", check:"aiSummary is returned.", trouble:["efname"]}
 ]},

{id:"router", grp:"Build", nav:"01 · Main Router", title:"Workflow 01: Main Data Operations Router", time:"5 min", wf:true,
 intro:"The router is the single entry point. It reads a request, decides which operation it is and calls the matching sub-workflow. No webhook or external service is involved.",
 flow:[["",["Trigger manually|trig","Request|logic","Route Operation|logic"]],["QUERY",["Run Query|sub","→ 02 - Query Filter Sort Data|trig"]],["UPDATE",["Run Update|sub","→ 03 - Controlled Data Update|trig"]],["REPORT",["Run Report|sub","→ 05 - Reporting and Aggregation|trig"]]],
 teach:{notes:"This is the agent architecture from the lecture with the model removed: a request, a tool choice, a controlled tool, the data, the audit log. Say that an AI agent would fill the Request node, and nothing else would change.", pause:"Pause when the first end-to-end QUERY returns Sean and Jessica.", mistakes:["Switch rule values in lower case.","Mapping inputs in Fixed mode.","Forgetting to save the sub-workflows first."], ask:"What is the advantage of using a sub-workflow?", ans:"Reuse and isolation. Each sub-workflow has one job, can be tested alone and can be called from many places."},
 steps:[
 {id:"t1", title:"Create the workflow with a manual trigger", why:"A manual trigger runs the workflow when you click a button. That is all a local lab needs.",
  do:["Create a workflow with the name below.","Add <b>Trigger manually</b>."], node:["Trigger manually (Manual Trigger)","trig"], copy:[{t:"Workflow name",v:"01 - Main Data Operations Router"}],
  expect:"A canvas with one trigger node.", check:"Router workflow created."},
 {id:"t2", title:"Describe the request", why:"This node stands in for a form or an AI agent. It holds the operation and its parameters as structured data.",
  do:["Add <b>Edit Fields (Set)</b> and rename it <code>Request</code>.","Mode: <b>JSON</b>. Paste the block below. This one is plain JSON, so the field can stay in Fixed mode.","To run a different operation later you only replace this JSON."],
  node:["Edit Fields (Set) → rename: Request","logic"], copy:[{t:"Request JSON for QUERY",v:REQ.q}],
  expect:"Execute the step: one item with seven fields, <code>operation: QUERY</code>.", check:"Request outputs the QUERY item."},
 {id:"t3", title:"Route by operation", why:"Switch sends the item down the output whose rule matches. Anything else goes nowhere, so unknown operations do nothing.",
  do:["Add <b>Switch</b> and rename it <code>Route Operation</code>. Mode: <b>Rules</b>.","Create three routing rules as below. For each, turn on <b>Rename Output</b> and use the operation name."],
  node:["Switch → rename: Route Operation","logic"],
  config:[["Mode","Rules"],["Rule 1","{{ $json.operation }}  String → is equal to  QUERY","x"],["Rule 1, Output Name","QUERY","c"],["Rule 2","{{ $json.operation }}  String → is equal to  UPDATE","x"],["Rule 2, Output Name","UPDATE","c"],["Rule 3","{{ $json.operation }}  String → is equal to  REPORT","x"],["Rule 3, Output Name","REPORT","c"]],

var KEY = "n8nlab.v1", st = {done:{}, os:"", instr:false};
try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && p.done) st = p; } } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} }
var copies = [], cur = "start";
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function pick(v){ return (v && v.__os) ? v[st.os || "win"] : v; }
function cp(text, label){ copies.push(text); return '<button type="button" class="cbtn" data-cp="'+(copies.length-1)+'" aria-label="Copy '+esc(label||"")+'">Copy</button>'; }
function copyBlock(c){ var lab = pick(c.t); return '<div class="copy'+(c.wrap?' wrapit':'')+'"><div class="copy-h"><span>'+esc(lab)+'</span>'+cp(c.v,lab)+'</div><pre>'+esc(c.v)+'</pre></div>'; }
function stepChecks(s){ return s.checks || [{id:s.id, label:s.check || "My result matches."}]; }
function secIds(sec){
  var ids = [];
  if (sec.steps) sec.steps.forEach(function(s){ stepChecks(s).forEach(function(c){ ids.push(c.id); }); });
  if (sec.custom === "preflight") PF.forEach(function(p){ ids.push(p[0]); });
  if (sec.custom === "tests") { TESTS.forEach(function(t){ ids.push(t.id); }); ids.push("x5"); }
  return ids;
}
function pfDone(){ return PF.every(function(p){ return st.done[p[0]]; }); }
function secDone(sec){ if (sec.id==="start") return !!st.os; if (sec.optional || sec.custom==="help") return true; return secIds(sec).every(function(x){return st.done[x];}); }
function blocker(sec){ if (st.instr || sec.custom==="help") return null; for (var k=0;k<S.length;k++){ if (S[k]===sec) return null; if (!secDone(S[k])) return S[k]; } return null; }
function locked(sec){ return !!blocker(sec); }
function tsItem(k){ var t = TS[k]; return '<details class="ts"><summary>'+esc(t[1])+'</summary><div class="d-in">'+pick(t[2])+'</div></details>'; }
function pic(m){ return '<figure style="margin:0;display:flex;flex-direction:column;gap:6px"><div class="scroll" style="border:1px solid var(--line)'+(m.w?';width:fit-content;max-width:100%':'')+'"><img src="'+m.src+'" alt="'+esc(m.alt)+'" style="display:block;'+(m.w?'width:'+m.w+';max-width:100%':'width:100%;min-width:640px')+';height:auto"></div><figcaption style="font-size:15px">'+m.cap+'</figcaption></figure>'; }
function shot(a){ return '<div class="shot"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><div><b>[SCREENSHOT: '+esc(a[0])+']</b>'+esc(a[1])+'</div></div>'; }
function flow(rows){
  return '<div class="card"><span class="lab">Workflow map</span><div class="flow">'+rows.map(function(r){
    return '<div class="row">'+(r[0]?'<span class="rl">'+esc(r[0])+'</span>':'')+r[1].map(function(n,i){ var p=n.split("|"); return (i?'<span class="ar">→</span>':'')+'<span class="n k-'+p[1]+'">'+esc(p[0])+'</span>'; }).join("")+'</div>';
  }).join("")+'</div></div>';
}
function teach(t){
  if (!st.instr || !t) return "";
  return '<div class="teach"><span class="lab">Instructor notes</span><p>'+esc(t.notes)+'</p><p><b>Pause point:</b> '+esc(t.pause)+'</p><div><b>Common mistakes</b><ul>'+t.mistakes.map(function(m){return '<li>'+esc(m)+'</li>';}).join("")+'</ul></div><p><b>Ask the class:</b> “'+esc(t.ask)+'”</p><p><b>Expected answer:</b> '+esc(t.ans)+'</p></div>';
}
function ckbox(id, label, env){ return '<label><input type="checkbox" id="ck-'+id+'" data-ck="'+id+'"'+(env?' data-env="'+env+'"':'')+(st.done[id]?' checked':'')+'> '+esc(label)+'</label>'; }

function renderStep(s, n){
  var h = '<section class="card step'+(stepChecks(s).every(function(c){return st.done[c.id];})?' ok':'')+'" data-step="'+s.id+'">';
  h += '<div class="step-h"><span class="num">Step '+n+'</span><h3>'+esc(pick(s.title))+'</h3></div>';
  h += '<div class="blk"><label>Why are we doing this?</label><p>'+pick(s.why)+'</p></div>';
  var d = pick(s.do);
  if (d) h += '<div class="blk"><label>Do this</label><ol>'+d.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ol></div>';
  if (s.html) h += s.html;
  if (s.dl) h += '<div><a class="btn" href="'+s.dl.href+'" download="'+esc(s.dl.name)+'">'+esc(s.dl.label)+' ↓</a></div>';
  if (s.link) h += '<div><a class="btn" href="'+s.link.href+'" target="_blank" rel="noopener">'+esc(s.link.label)+' ↗</a></div>';
  if (s.node) h += '<div class="blk"><label>Node to add</label><span class="nodechip k-'+s.node[1]+'">'+esc(s.node[0])+'</span></div>';
  if (s.config) h += '<div class="blk"><label>Configure it like this</label>'+(s.config.some(function(r){return (r[2]||"").indexOf("x")>-1;})?'<p class="note" style="font-size:15px">Values marked <i>(Expression)</i> only work in Expression mode. Hover over the field and switch it from <b>Fixed</b> to <b>Expression</b> first, then paste the value. The field turns into an expression editor and shows a preview of the result.</p>':'')+'<div class="scroll"><table class="cfg">'+s.config.map(function(r){
    var f = r[2]||""; return '<tr><td>'+esc(r[0])+'</td><td><div class="v"><span>'+(f.indexOf("x")>-1?'<i class="tag">Expression</i>':'')+esc(r[1])+'</span>'+(f.indexOf("c")>-1?cp(r[1],r[0]):'')+'</div></td></tr>';
  }).join("")+'</table></div></div>';
  if (s.dataTabs) h += '<details><summary>Backup: create the tabs and paste the data by hand</summary><div class="d-in"><ol><li>Rename <b>Sheet1</b> to <code>STUDENTS</code> and add four more tabs: <code>COURSES</code>, <code>ENROLLMENTS</code>, <code>ASSIGNMENTS</code>, <code>AUDIT_LOG</code>.</li><li>For each tab: press <b>Copy</b> below, click cell <b>A1</b> of that tab and paste. The text is tab-separated, so it fills the columns.</li></ol>'+Object.keys(DATA).map(function(k){
    var rows = DATA[k]; return '<details'+(k==="STUDENTS"?' open':'')+'><summary>'+k+': '+(rows.length-1)+' data row'+(rows.length===2?'':'s')+'</summary><div class="d-in"><div>'+cp(tsv(rows),k+" data")+' <span style="font-size:13px;color:var(--muted)">copies tab-separated text for cell A1</span></div><div class="scroll"><table class="data"><tr>'+rows[0].map(function(c){return '<th>'+esc(c)+'</th>';}).join("")+'</tr>'+rows.slice(1).map(function(r){return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join("")+'</tr>';}).join("")+'</table></div></div></details>';
  }).join("")+'</div></div></details>';
  var c = pick(s.copy);
  if (c) h += '<div class="blk"><label>Copy this</label>'+c.map(copyBlock).join("")+'</div>';
  var ex = pick(s.extra); if (ex) h += ex;
  if (s.extraHtml) h += s.extraHtml.replace("__COPY__", s.extraCopy ? copyBlock(s.extraCopy) : "");
  h += '<div class="blk expect"><label>Expected result</label><div>'+pick(s.expect)+'</div></div>';
  if (s.img) h += pic(s.img);
  if (s.shot) h += shot(s.shot);
  var tr = pick(s.trouble);
  if (tr && tr.length) h += '<details class="ts"><summary>If it doesn’t work</summary><div class="d-in">'+tr.map(tsItem).join("")+'</div></details>';
  h += '<div class="ck">'+stepChecks(s).map(function(k){return ckbox(k.id,k.label,k.env);}).join("")+'</div></section>';
  return h;
}

function renderCustom(sec){

  if (sec.custom === "start"){
    h += '<div class="sec-h"><span class="eyebrow">Application Database Management · hands-on lab</span><h1>AI-Powered Database Automation with n8n</h1><p>Building connected workflows for querying, sorting, updating, reporting and auditing structured data. You apply what the lecture covered: structured data, tool calling, validation, auditing and grounding.</p></div>';
    h += osChooser();
    h += '<div class="card"><span class="lab">What you will build</span><p>Five small workflows that work as one system. The router picks an operation, a sub-workflow does the work on Google Sheets and every operation is written to an audit log.</p></div>'+archDiagram();
    h += '<div class="card"><span class="lab">Plan for the session</span><div class="scroll"><table class="cfg">'+S.filter(function(x){return x.time;}).map(function(x){return '<tr><td>'+esc(x.nav)+'</td><td>'+esc(x.time)+'</td></tr>';}).join("")+'</table></div><p style="color:var(--muted);font-size:14px">Setup (install, account, dataset, Google connection) takes about 20–25 minutes the first time. The five workflows and the tests take about 35–40 minutes.</p></div>';
    h += '<div class="card"><span class="lab">How each step works</span><p>Every step tells you why, what to click, which node to add, what to type and what you should see. Use the <b>Copy</b> buttons instead of typing. Tick the checkpoint when your result matches. If it doesn’t, open <b>If it doesn’t work</b>.</p></div>';
    if (st.instr) h += '<div class="teach"><span class="lab">Instructor notes</span><p>The full lab is longer than 40 minutes if students do the Google Cloud setup in class. To fit a 30–40 minute session, assign the four Setup sections before class and start at the pre-flight check.</p><p>Instructor mode shows every step and unlocks every section, so you can jump around freely.</p></div>';
  }
  if (sec.custom === "preflight"){
    h += '<div class="sec-h"><span class="eyebrow">Setup · '+sec.time+'</span><h1>Pre-flight check</h1><p>The workflows depend on everything below. If one item is missing, a later step will fail in a way that is hard to trace. The next section unlocks when every box is ticked.</p></div>';
    h += '<div class="card"><span class="lab">Why each item matters</span><div class="flow"><div class="row"><span class="n k-trig">Node.js</span><span class="ar">→</span><span class="n k-trig">n8n running</span><span class="ar">→</span><span class="n k-trig">owner account</span><span class="ar">→</span><span class="n k-sub">Google project + 2 APIs</span><span class="ar">→</span><span class="n k-sub">OAuth client + test user</span><span class="ar">→</span><span class="n k-sub">n8n credential</span><span class="ar">→</span><span class="n k-data">spreadsheet + tabs</span></div></div><p>Each link needs the one before it. n8n can’t reach your sheet without the credential, and the credential can’t be created without the client and both APIs.</p></div>';
    h += '<div class="card"><span class="lab">Checklist</span>'+PF.map(function(p){ return '<div class="ck" style="border:0;padding:0;justify-content:space-between">'+ckbox(p[0],p[1])+'<button type="button" class="cbtn" data-go="'+p[2]+'">Go to section</button></div>'; }).join("")+'</div>';
    h += '<div class="card" id="pfstate">'+(pfDone()?'<p><b style="color:var(--data)">All clear.</b> The Build sections are unlocked.</p>':'<p><b style="color:var(--sec)">'+PF.filter(function(p){return !st.done[p[0]];}).length+' item(s) left.</b> Finish them before you build the workflows.</p>')+'</div>';
  }
  if (sec.custom === "tests"){
    h += '<div class="sec-h"><span class="eyebrow">Finish · '+sec.time+'</span><h1>Connected workflow tests</h1><p>For each test: open workflow 01, open the <b>Request</b> node, replace its JSON with the block below, choose <b>Execute workflow</b> and compare.</p></div>';
    h += '<div class="note">Before you start, check that A003 has Status <b>Open</b> in the ASSIGNMENTS tab.</div>';
    h += teach({notes:"Run the four tests in order on the projector, then let students repeat them.", pause:"After Test 3, open the sheet and show that nothing changed.", mistakes:["Running Test 3 before Test 2, which changes the expected OldValue.","Forgetting to replace the Request JSON."], ask:"Test 3 failed on purpose. Was the system working correctly?", ans:"Yes. Rejecting an invalid value, leaving the data unchanged and recording the attempt is the correct behavior."});
    TESTS.forEach(function(t){
      var ti = TESTS.indexOf(t); if (!st.instr && ti>0 && !st.done[TESTS[ti-1].id]) return; h += '<section class="card step'+(st.done[t.id]?' ok':'')+'"><div class="step-h"><h3>'+esc(t.name)+'</h3></div><div class="blk"><label>Input</label><p>'+esc(t.give)+'</p></div><div class="blk"><label>Copy this into the Request node</label>'+copyBlock({t:"Request JSON",v:t.json})+'</div><div class="blk expect"><label>Expected result. Look at: '+esc(t.look)+'</label><div>'+t.expect+'</div></div><details class="ts"><summary>If it doesn’t work</summary><div class="d-in">'+["submap","nooutput","pinned","filterall"].map(tsItem).join("")+'</div></details><div class="ck">'+ckbox(t.id,"My result matches.")+'</div></section>';
    });
    h += '<section class="card step'+(st.done.x5?' ok':'')+'"><div class="step-h"><h3>Test 5: Audit log</h3></div><div class="blk"><label>Do this</label><p>Open the <b>AUDIT_LOG</b> tab in Google Sheets and read the newest rows.</p></div><div class="blk expect"><label>Expected result</label><div class="scroll"><table class="data"><tr><th>Action</th><th>Workflow</th><th>RecordID</th><th>OldValue</th><th>NewValue</th><th>Result</th></tr><tr><td>READ_FILTER_SORT</td><td>02 - Query Filter Sort Data</td><td>STUDENTS</td><td></td><td></td><td>Returned 2 record(s)…</td></tr><tr><td>UPDATE_STATUS</td><td>03 - Controlled Data Update</td><td>A003</td><td>Open</td><td>Completed</td><td>Status changed from Open to Completed.</td></tr><tr><td>VALIDATION_FAILED</td><td>03 - Controlled Data Update</td><td>A003</td><td>Completed</td><td>Deleted</td><td>Invalid status.</td></tr><tr><td>GENERATE_REPORT</td><td>05 - Reporting and Aggregation</td><td>STUDENTS</td><td></td><td></td><td>Report generated for 6 students</td></tr></table></div><p style="margin-top:6px">Each row also has a timestamp and the user <code>lab-user</code>.</p></div><div class="ck">'+ckbox("x5","All four operations are in my audit log.")+'</div></section>';
  }
  if (sec.custom === "wrapup"){
    h += '<div class="sec-h"><span class="eyebrow">Finish · '+sec.time+'</span><h1>What we built</h1><p>A modular structured-data automation system that can query, filter, sort, validate, update, aggregate, report and audit.</p></div>'+archDiagram();
    h += '<div class="card"><span class="lab">What each workflow demonstrates</span><div class="grid2"><div class="mini"><b>01 Main Router</b><span>Conditional logic, one entry point, orchestration of sub-workflows.</span></div><div class="mini"><b>02 Query Filter Sort</b><span>Read operations: WHERE and ORDER BY on structured data.</span></div><div class="mini"><b>03 Controlled Update</b><span>CRUD with validation, failure branches and data integrity.</span></div><div class="mini"><b>04 Audit Logger</b><span>A reusable component and separation of concerns.</span></div><div class="mini"><b>05 Reporting</b><span>GROUP BY, COUNT and AVG, plus an optional grounded AI summary.</span></div></div></div>';
    h += '<div class="card"><span class="lab">From the lecture to the lab</span><div class="flow"><div class="row"><span class="n k-data">Structured data</span><span class="ar">→</span><span class="n k-logic">Controlled operations</span><span class="ar">→</span><span class="n k-logic">Automation</span><span class="ar">→</span><span class="n k-sub">Validation</span><span class="ar">→</span><span class="n k-sub">Integrity</span><span class="ar">→</span><span class="n k-sub">Auditing</span><span class="ar">→</span><span class="n k-logic">Optional AI</span></div></div><ul><li><b>Structured data:</b> five tables with exact column names made every node predictable.</li><li><b>Controlled operations:</b> each sub-workflow accepts only the inputs it declares, like a tool with a schema.</li><li><b>Validation and integrity:</b> the update ran only after two checks passed.</li><li><b>Auditing:</b> reads, writes, reports and failures all left a row.</li><li><b>Optional AI:</b> the model explained numbers the database had already computed, and it had no way to write.</li></ul></div>';
    h += teach({notes:"Close by putting the lecture's final architecture slide next to this diagram. They are the same picture.", pause:"Leave two minutes for questions.", mistakes:["Students stopping n8n before saving their last workflow."], ask:"Where would authentication and authorization sit in this system?", ans:"Before the router. The request would carry the user's identity, and each sub-workflow would check what that user may do before touching the data."});
  }
  if (sec.custom === "help"){
    h += '<div class="sec-h"><span class="eyebrow">Reference</span><h1>Troubleshooting center</h1><p>Search by error text or symptom. Entries marked for one operating system follow your choice in the top bar.</p></div>';
    h += '<input class="search" id="tsq" type="search" placeholder="Search, for example: redirect, not recognized, no rows" aria-label="Search troubleshooting">';
    h += '<div id="tslist" style="display:flex;flex-direction:column;gap:8px">'+Object.keys(TS).filter(function(k){ var o=TS[k][0]; return !o || !st.os || o===st.os; }).map(tsItem).join("")+'</div>';
  }
  return h;
}

function render(){
  copies = [];
  var sec = S.filter(function(x){return x.id===cur;})[0] || S[0], i = S.indexOf(sec), h = envPanel();
  if (locked(sec)){
    h += '<div class="sec-h"><span class="eyebrow">Locked</span><h1>'+esc(sec.title)+'</h1></div>'+(function(b){ return '<div class="card"><p><b>This section is locked.</b> Finish “'+esc(b.nav)+'” first. '+(b.id==="start"?'Choose your operating system there.':'Every checkpoint in it must be ticked.')+'</p><div><button type="button" class="btn" data-go="'+b.id+'">Go to '+esc(b.nav)+'</button></div></div>'; })(blocker(sec));
  } else if (sec.custom){
    h += renderCustom(sec);
  } else {
    h += '<div class="sec-h"><span class="eyebrow">'+esc(sec.grp)+' · '+esc(sec.time)+(sec.optional?' · optional':'')+'</span><h1>'+esc(sec.title)+'</h1><p>'+sec.intro+'</p></div>';
    if (sec.needOS && !st.os) h += osChooser();
    else {
      if (sec.needOS) h += '<div class="note" style="font-size:14px">Showing instructions for <b>'+(st.os==="win"?"Windows":"macOS")+'</b>. Switch in the top bar at any time.</div>';
      if (sec.pre) h += sec.pre;
      if (sec.flow) h += flow(sec.flow);
      h += teach(sec.teach);
      var stop = false;
      sec.steps.forEach(function(s,n){ if (stop) return; h += renderStep(s,n+1); if (!st.instr && !stepChecks(s).every(function(c){return st.done[c.id];})){ stop = true; if (n < sec.steps.length-1) h += '<div class="note">Step '+(n+2)+' of '+sec.steps.length+' appears when you tick the checkpoint above.</div>'; } });
    }
  }
  var prev = S[i-1], next = S[i+1];
  h += '<div class="pn">'+(prev?'<button type="button" class="btn ghost" data-go="'+prev.id+'">← '+esc(prev.nav)+'</button>':'<span></span>')+(next?(locked(next)?'<span class="note">Finish this section to continue.</span>':'<button type="button" class="btn" data-go="'+next.id+'">'+esc(next.nav)+' →</button>'):'')+'</div>';
  document.getElementById("main").innerHTML = h;
  renderNav(); renderTop();
}
function renderNav(){
  var h = "", g = "";
  S.forEach(function(sec, n){
    if (sec.grp !== g){ g = sec.grp; h += '<div class="grp">'+g+'</div>'; }
    var ids = secIds(sec), d = ids.filter(function(x){return st.done[x];}).length, full = ids.length && d===ids.length, lk = locked(sec);
    h += '<button type="button" data-go="'+sec.id+'" class="'+(full?'done ':'')+(lk?'locked':'')+'"'+(sec.id===cur?' aria-current="true"':'')+'><span class="dot">'+(full?'✓':'')+'</span><span class="lbl">'+esc(sec.nav)+'</span>'+(ids.length?'<span class="ct">'+d+'/'+ids.length+'</span>':'')+'</button>';
  });
  document.getElementById("nav").innerHTML = h;
}
function renderTop(){
  var all = []; S.forEach(function(s){ all = all.concat(secIds(s)); });
  var d = all.filter(function(x){return st.done[x];}).length;
  document.getElementById("ptext").textContent = d+" of "+all.length+" checkpoints";
  document.getElementById("pbar").style.width = (all.length ? Math.round(d/all.length*100) : 0)+"%";
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"), function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-os")===st.os)); });
  document.getElementById("instr").checked = !!st.instr;
}
function go(id, keepScroll){
  if (!S.some(function(x){return x.id===id;})) id = "start";
  cur = id; render();
  try { if (location.hash !== "#"+id) history.replaceState(null, "", "#"+id); } catch(e){ location.hash = id; }
  document.getElementById("nav").classList.remove("open");
  if (!keepScroll) window.scrollTo(0,0);
}

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-cp],[data-go],[data-os],#mnav,#reset") : null;
  if (!t) return;
  if (t.hasAttribute("data-cp")){
    var text = copies[+t.getAttribute("data-cp")], ok = function(){ t.textContent = "Copied"; t.classList.add("ok"); setTimeout(function(){ t.textContent = "Copy"; t.classList.remove("ok"); }, 1400); };
    var fb = function(){ var ta = document.createElement("textarea"); ta.value = text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); ok(); } catch(er){ t.textContent = "Select and copy"; } document.body.removeChild(ta); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb); else fb();
  } else if (t.hasAttribute("data-go")) go(t.getAttribute("data-go"));
  else if (t.hasAttribute("data-os")){ st.os = t.getAttribute("data-os"); save(); render(); }
  else if (t.id === "mnav"){ var nv = document.getElementById("nav"); nv.classList.toggle("open"); t.setAttribute("aria-expanded", String(nv.classList.contains("open"))); }
  else if (t.id === "reset"){
    if (t.getAttribute("data-arm")){ st.done = {}; save(); t.removeAttribute("data-arm"); t.textContent = "Reset progress"; render(); }
    else { t.setAttribute("data-arm","1"); t.textContent = "Click again to clear all checkmarks"; setTimeout(function(){ t.removeAttribute("data-arm"); t.textContent = "Reset progress"; }, 4000); }
  }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "instr"){ st.instr = t.checked; save(); render(); return; }
  var id = t.getAttribute && t.getAttribute("data-ck");
  if (!id) return;
  if (t.checked) st.done[id] = true; else delete st.done[id];
  var env = t.getAttribute("data-env");
  if (env){ if (t.checked) st.done["env-"+env] = true; else delete st.done["env-"+env]; }
  save();
  var y = window.scrollY; render(); window.scrollTo(0, y);
  var again = document.getElementById("ck-"+id); if (again) again.focus();
});
document.addEventListener("input", function(e){
  if (e.target.id !== "tsq") return;
  var q = e.target.value.toLowerCase();
  Array.prototype.forEach.call(document.querySelectorAll("#tslist > details"), function(d){ d.hidden = q && d.textContent.toLowerCase().indexOf(q) < 0; });
});
window.addEventListener("hashchange", function(){ var id = location.hash.slice(1); if (id && id !== cur) go(id); });
go(location.hash.slice(1) || "start", true);
})();
</script>

</body>
